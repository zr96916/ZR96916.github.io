<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非法金融活动烽火台 · 任务工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dbe4ee; --bg-2:#e7edf4; --panel:#ffffff; --panel-2:#f5f8fb;
    --ink:#1f2d3d; --ink-2:#5b6b7c; --ink-3:#8a99a9;
    --line:#c9d5e2; --line-strong:#b0c0d2;
    --primary:#1155aa; --primary-deep:#0d4790; --primary-soft:#e6eef7; --primary-ghost:#d4e3f4;
    --risk-observe:#7d8b99; --risk-firefly:#5d8a3c; --risk-smoke:#c08a2e;
    --risk-flame:#d9632a; --risk-kindling:#b4231f;
    --ok:#3c7a3c; --warn:#c08a2e; --err:#b4231f; --info:#1155aa;
    --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Helvetica Neue",-apple-system,sans-serif;
    --shadow-sm:0 1px 2px rgba(30,45,70,.06);
    --shadow-md:0 2px 8px rgba(30,45,70,.08);
    --shadow-lg:0 10px 30px rgba(30,45,70,.16);
    --r:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}
  ::selection{background:var(--primary-ghost)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-variant-numeric:tabular-nums}

  .seal{width:34px;height:34px;flex:0 0 auto;border-radius:8px;background:linear-gradient(135deg,#1a66c9,var(--primary-deep));color:#fff;font-weight:700;font-size:19px;line-height:34px;text-align:center;box-shadow:0 2px 6px rgba(17,85,170,.28)}
  .seal.sm{width:28px;height:28px;font-size:15px;line-height:28px;border-radius:7px}

  .btn{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px;padding:8px 15px;border-radius:6px;border:1px solid transparent;transition:background .15s,border-color .15s,box-shadow .15s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(17,85,170,.24)}
  .btn-primary:hover{background:var(--primary-deep)}
  .btn-ghost{border-color:var(--line-strong);color:var(--ink-2);background:#fff}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-soft{background:var(--primary-soft);color:var(--primary-deep)}
  .btn-soft:hover{background:var(--primary-ghost)}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .icon{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .arrow{width:17px;height:17px;color:var(--ink-3)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:4px;white-space:nowrap;line-height:1.7}
  .badge .b-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-observing{color:#5f6b78;background:#eef1f5}
  .b-firefly{color:var(--risk-firefly);background:#eef3e7}
  .b-smoke{color:var(--risk-smoke);background:#f8f0e1}
  .b-flame{color:var(--risk-flame);background:#fbeae1}
  .b-kindling{color:var(--risk-kindling);background:#f9e3e1}
  .b-neutral{color:var(--ink-2);background:#edf1f5}
  .b-warn{color:var(--warn);background:#f8f0e1}
  .b-err{color:var(--err);background:#f9e3e1}
  .b-ok{color:var(--ok);background:#ecf3e6}
  .b-info{color:var(--info);background:var(--primary-soft)}
  .b-ai{color:#6a4bb8;background:#f0ebfb}
  .round-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--primary-deep);background:var(--primary-soft);padding:2px 9px;border-radius:4px}

  /* ===== 大屏（占位） ===== */
  .dash{min-height:100vh;background:radial-gradient(1200px 620px at 72% -10%,#10305a 0%,#08182c 46%,#040a14 100%);color:#cfe0f0;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .dash::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(80,140,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(80,140,220,.05) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
  .dash-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 32px}
  .dash-brand{display:flex;align-items:center;gap:12px}
  .dash-brand .t1{font-weight:700;font-size:18px;color:#eaf3ff}
  .dash-brand .t2{font-size:11px;color:#7f9cc0;letter-spacing:.08em}
  .dash-body{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 32px 70px;text-align:center}
  .dash-title{font-size:30px;font-weight:700;color:#eaf3ff;letter-spacing:.02em}
  .dash-sub{margin-top:10px;font-size:14px;color:#7f9cc0}
  .dash-kpis{display:flex;gap:22px;margin-top:44px;flex-wrap:wrap;justify-content:center}
  .dash-kpi{width:170px;padding:20px 18px;border:1px solid rgba(120,170,230,.18);border-radius:10px;background:rgba(16,48,90,.25);backdrop-filter:blur(2px)}
  .dash-kpi .kv{font-size:30px;font-weight:700;color:#9fc4ee}
  .dash-kpi .kl{margin-top:4px;font-size:12px;color:#7f9cc0}
  .dash-hint{margin-top:40px;font-size:12px;color:#5f7d9f}

  /* ===== 后台壳（顶部 tab 导航） ===== */
  .backend{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .backend-top{display:flex;align-items:center;gap:22px;padding:0 24px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .backend-top .brand{display:flex;align-items:center;gap:10px;margin-right:4px}
  .backend-top .brand .t1{font-weight:700;font-size:15px;color:var(--ink)}
  .backend-top .brand .t2{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:1px}
  .top-tabs{display:flex;align-items:stretch;gap:4px;height:100%}
  .top-tab{display:flex;align-items:center;gap:8px;padding:0 18px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;transition:color .13s,border-color .13s}
  .top-tab:hover{color:var(--primary)}
  .top-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
  .top-tab .ti{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .backend-top .spacer{flex:1}
  .backend-body{flex:1;overflow-y:auto;background:var(--bg)}

  .wrap{max-width:1160px;margin:0 auto;padding:24px 26px 70px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
  .page-head h1{font-weight:700;font-size:21px;color:var(--ink)}
  .page-head .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
  .page-head .head-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;padding-top:2px}

  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;box-shadow:var(--shadow-sm)}
  .stat .k{font-size:12px;color:var(--ink-3)}
  .stat .v{font-size:28px;font-weight:700;margin-top:1px;color:var(--ink)}
  .stat .v small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px}

  .task-tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .task-tab{display:flex;align-items:baseline;gap:8px;padding:11px 18px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink-2);font-size:13.5px;transition:border-color .13s,background .13s,color .13s;box-shadow:var(--shadow-sm)}
  .task-tab:hover{border-color:var(--primary)}
  .task-tab .n{font-size:22px;font-weight:700;color:var(--ink);line-height:1}
  .task-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
  .task-tab.active .n{color:#fff}
  .task-tabs .range-wrap{margin-left:auto;display:flex;align-items:center;gap:8px}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .list-head .t{font-weight:600;font-size:15px}
  .task-card{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 20px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,transform .13s}
  .task-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary-ghost)}
  .task-card .nm{font-weight:600;font-size:14.5px;color:var(--ink)}
  .task-card .mt{font-size:12px;color:var(--ink-3);margin-top:2px}
  .task-card .tm{font-size:12px;color:var(--ink-3);white-space:nowrap}
  .risk-legend{display:flex;gap:5px;align-items:center}
  .risk-pip{width:9px;height:9px;border-radius:2px}

  /* ===== 报告查看 ===== */
  .filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .filter{display:flex;flex-direction:column;gap:5px}
  .filter label{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
  .filter select,.filter input{padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink);min-width:130px;transition:border-color .15s,box-shadow .15s}
  .filter input{min-width:200px}
  .filter select:focus,.filter input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .filters .reset{align-self:flex-end;margin-bottom:1px}
  .rep-row{display:grid;grid-template-columns:1.4fr 1.2fr .6fr .8fr .7fr .9fr auto;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff;box-shadow:var(--shadow-sm)}
  .rep-row .en{font-weight:600;font-size:13.5px;color:var(--ink)}
  .rep-row .es{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .rep-row .cell .lbl{font-size:10.5px;color:var(--ink-3)}
  .rep-row .cell .val{font-size:13px;font-weight:600;margin-top:1px;color:var(--ink)}
  .rep-row .cell .val.soft{font-weight:500;color:var(--ink-2)}
  .score-big{font-size:20px;font-weight:700}
  .empty{text-align:center;padding:50px 20px;color:var(--ink-3);font-size:13.5px}
  .result-count{font-size:12px;color:var(--ink-3);margin:2px 3px 10px}

  /* ===== 任务工作台（左侧流程 + 顶部标题栏） ===== */
  .ws{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  .ws-top{display:flex;align-items:center;gap:14px;padding:0 24px;height:56px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .ws-top .tt{font-weight:600;font-size:15px;color:var(--ink)}
  .ws-top .crumb{font-size:12px;color:var(--ink-3);margin-top:1px}
  .ws-top .spacer{flex:1}
  .ws-top .prog{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}

  .ws-body{flex:1;display:grid;grid-template-columns:240px 1fr;overflow:hidden}
  .ws-nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 12px;overflow-y:auto}
  .ws-nav .nav-cap{font-size:11px;color:var(--ink-3);letter-spacing:.05em;padding:2px 8px 8px}
  .stage{display:flex;gap:11px;padding:10px 11px;border-radius:7px;cursor:pointer;margin-bottom:3px;transition:background .13s}
  .stage:hover{background:var(--panel-2)}
  .stage.active{background:var(--primary-soft)}
  .stage.lock{opacity:.42;pointer-events:none}
  .stage .st-num{width:21px;height:21px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line-strong);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink-3);background:#fff;transition:.18s}
  .stage.done .st-num{background:var(--ok);border-color:var(--ok);color:#fff}
  .stage.active .st-num{background:var(--primary);border-color:var(--primary);color:#fff}
  .stage .st-body .st-t{font-size:13.5px;font-weight:600;color:var(--ink)}
  .stage.active .st-body .st-t{color:var(--primary-deep)}
  .stage .st-body .st-s{font-size:11px;color:var(--ink-3);margin-top:1px}
  .round-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--ink-3);padding:10px 6px 4px;margin-top:8px;letter-spacing:.04em;border-top:1px solid var(--line)}
  .round-head .rn{color:var(--primary);font-weight:700}
  .round-head .hist{margin-left:auto;font-size:11px;color:var(--primary);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:3px}
  .round-head .hist:hover{text-decoration:underline}
  .ws-nav .foot{margin-top:auto;font-size:11px;color:var(--ink-3);padding:12px 6px 2px;line-height:1.7;border-top:1px solid var(--line)}
  .ws-canvas{overflow-y:auto;padding:24px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
  .panel + .panel{margin-top:14px}
  .panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .panel-h .t{font-weight:600;font-size:14px}
  .panel-h .sub{font-size:12px;color:var(--ink-3)}
  .panel-h .spacer{flex:1}
  .panel-b{padding:10px 18px 18px}
  .sec-label{font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin:16px 3px 8px}
  .flow-hint{background:var(--primary-soft);border:1px solid var(--primary-ghost);border-radius:var(--r);padding:13px 16px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px;line-height:1.9}
  .flow-hint b{color:var(--primary-deep)}

  .mat{display:flex;align-items:center;gap:13px;padding:12px 14px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff}
  .mat .fico{width:36px;height:36px;flex:0 0 auto;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--primary)}
  .mat .fn{font-weight:600;font-size:13.5px;color:var(--ink)}
  .mat .fm{font-size:11.5px;color:var(--ink-3);margin-top:1px}

  .formfile{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--panel-2);cursor:pointer;transition:border-color .15s,background .15s}
  .formfile:hover{border-color:var(--primary);background:var(--primary-soft)}
  .formfile.done{border-style:solid;background:#fff;cursor:default}
  .formfile .fico{width:38px;height:38px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary)}

  .cand{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:7px;margin-bottom:7px;background:#fff;cursor:pointer;transition:border-color .13s,background .13s}
  .cand:hover{border-color:var(--primary-ghost)}
  .cand.off{opacity:.55}
  .cand .ck{width:17px;height:17px;flex:0 0 auto;border-radius:4px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:transparent;background:#fff;transition:.13s;font-size:11px}
  .cand.on .ck{background:var(--primary);border-color:var(--primary);color:#fff}
  .cand .cn{font-weight:600;font-size:13.5px;color:var(--ink)}
  .cand .cc{font-size:11.5px;color:var(--ink-3)}
  .cand .spacer{flex:1}
  .screen-note{font-size:11px;color:var(--warn);display:inline-flex;align-items:center;gap:4px}
  .screen-note.dup{color:var(--ink-3)}

  .sum{display:flex;gap:24px;flex-wrap:wrap;padding:2px 3px}
  .sum .si{font-size:13px;color:var(--ink-2)}
  .sum .si b{font-size:20px;font-weight:700;margin-right:3px;color:var(--ink)}
  .sum .si .k{font-size:12px;color:var(--ink-3)}

  .erow{display:grid;grid-template-columns:1.2fr .9fr .8fr .8fr .9fr auto;align-items:center;gap:15px;padding:13px 16px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff;cursor:pointer;transition:box-shadow .13s,border-color .13s}
  .erow:hover{box-shadow:var(--shadow-md);border-color:var(--primary-ghost)}
  .erow .en{font-weight:600;font-size:13.5px;color:var(--ink)}
  .erow .es{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .erow .cell .lbl{font-size:10.5px;color:var(--ink-3)}
  .erow .cell .val{font-size:13px;font-weight:600;margin-top:1px;color:var(--ink)}
  .erow.rev{grid-template-columns:auto 1.2fr .8fr .7fr .8fr .9fr auto}
  .rck{width:17px;height:17px;flex:0 0 auto;border-radius:4px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:transparent;background:#fff;cursor:pointer;transition:.13s;font-size:11px;font-weight:700}
  .rck.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .rck.dis{opacity:.35;cursor:not-allowed;background:var(--panel-2)}
  .batch-bar{display:flex;align-items:center;gap:14px;padding:11px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;margin-bottom:10px;flex-wrap:wrap}
  .batch-bar .sel{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
  .batch-bar .cnt{font-size:12px;color:var(--ink-3)}
  .batch-bar .spacer{flex:1}

  .dim{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff;overflow:hidden}
  .dim-h{display:flex;align-items:center;gap:11px;padding:12px 15px;cursor:pointer}
  .dim-h:hover{background:var(--panel-2)}
  .dim .dcat{width:28px;height:28px;flex:0 0 auto;border-radius:6px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
  .dim .dn{font-weight:600;font-size:13.5px;color:var(--ink)}
  .dim .dd{font-size:11px;color:var(--ink-3);margin-top:1px}
  .dim .spacer{flex:1}
  .dim .score{margin-left:10px;text-align:right}
  .dim .score .sv{font-size:16px;font-weight:700}
  .dim .score .sk{font-size:10px;color:var(--ink-3)}
  .dim .chev{width:15px;height:15px;color:var(--ink-3);transition:transform .18s}
  .dim.open .chev{transform:rotate(180deg)}
  .dim-b{display:none;padding:2px 15px 14px;border-top:1px solid var(--line);background:var(--panel-2)}
  .dim.open .dim-b{display:block}
  .fact{padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:7px;margin-top:9px}
  .fact .ft{font-size:13px;color:var(--ink)}
  .fact .ev{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
  .fact .ev .pin{font-size:11px;font-weight:500;color:var(--primary-deep);background:var(--primary-soft);padding:1px 7px;border-radius:4px;font-family:ui-monospace,Consolas,monospace}
  .fact .ev .conf{font-size:11px;color:var(--ink-3)}
  .fact .act{margin-left:auto;display:flex;gap:8px}

  .scorebar{position:sticky;bottom:0;display:flex;align-items:center;gap:20px;padding:14px 20px;margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-md)}
  .scorebar .formula{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .scorebar .part{font-size:13px;color:var(--ink-2)}
  .scorebar .part b{font-size:17px;color:var(--ink)}
  .scorebar .eq{color:var(--ink-3);font-weight:700}
  .scorebar .total{font-size:28px;font-weight:700;color:var(--primary)}
  .scorebar .spacer{flex:1}

  .rep{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff}
  .rep .en{font-weight:600;font-size:13.5px;color:var(--ink)}
  .rep .es{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .rep .spacer{flex:1}
  .chapters{display:flex;gap:9px}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function riskBadge(r){
  if(!r) return '<span class="badge b-neutral">待定</span>';
  const m=RISK[r]||RISK['观察'];
  return `<span class="badge ${m.cls}"><span class="b-dot"></span>${r}</span>`;
}
function riskPips(risk){
  let h='';
  RISK_ORDER.forEach(k=>{ if(risk[k]>0) h+=`<span class="risk-pip" style="background:${RISK[k].hex}" title="${k} ${risk[k]}家"></span>`; });
  return h;
}
const statusBadge = s => ({
  '研判中':'b-info','待初筛':'b-neutral','已完成':'b-ok'
}[s]||'b-neutral');

function toast(msg){
  let t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#1f2d3d;color:#fff;padding:11px 20px;border-radius:7px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:99;animation:rise .25s ease';
  document.body.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateX(-50%) translateY(6px)';setTimeout(()=>t.remove(),300);},2200);
}
function fmtNow(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function rangeThreshold(days){
  const d=new Date(TODAY.getTime()); d.setDate(d.getDate()-days);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function renderReportList(){
  let list = REPORTS.filter(r=>{
    if(FILTER.task!=='全部' && r.task!==FILTER.task) return false;
    if(FILTER.risk!=='全部' && r.risk!==FILTER.risk) return false;

    if(FILTER.range!=='全部'){
      const days=(TODAY - new Date(r.time))/86400000;
      if(FILTER.range==='7' && days>7) return false;
      if(FILTER.range==='30' && days>30) return false;
    }
    if(FILTER.kw && FILTER.kw.trim()){
      const k=FILTER.kw.trim();
      if(!r.company.includes(k) && !r.credit.includes(k) && !r.task.includes(k)) return false;

  const html = list.length

function renderStageList(){
  const screened = WS.screened || WS.task.companies>0;
  let html = STAGES.slice(0,3).map((s,i)=>{
    const num=i+1;
    let cls='stage'; if(num===WS.stage) cls+=' active'; else if(num<WS.stage||screened) cls+=' done';
    return stageItem(num,s,cls);
  }).join('');
  html += `<div class="round-head"><span>研判轮次</span> · <span class="rn">第 ${WS.round} 轮</span>
    <button class="hist" data-action="round-history"><svg class="icon" width="13" height="13" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>历史</button></div>`;
  html += STAGES.slice(3).map((s,i)=>{
    const num=i+4;
    let cls='stage'; if(num===WS.stage) cls+=' active';
    if(!screened) cls+=' lock';
    return stageItem(num,s,cls);
  }).join('');
  $('#stage-list').innerHTML = html;
}
function stageItem(num,s,cls){
  return `<div class="${cls}" data-action="stage" data-stage="${num}">
    <div class="st-num">${cls.includes('done')?'✓':num}</div>
    <div class="st-body"><div class="st-t">${s.n}</div><div class="st-s">${s.s}</div></div>
  </div>`;
}

function openTask(id){
  WS.task = TASKS.find(t=>t.id===id);
  WS.stage = WS.task.stage||1;
  WS.round = WS.task.round||1;
  WS.company = 0; WS.inCompany = false;
  WS.candidates = COMPANY_FORM.map(c=>({...c}));
  WS.formUploaded = WS.task.stage >= 3 || WS.task.companies>0;

function renderCanvas(){
  const s = WS.stage;
  let crumb = `任务中心 / ${WS.task.name} / ${STAGES[s-1].n}`;
  if(s===6 && WS.inCompany) crumb += ` / ${COMPANIES[WS.company].n}`;
  $('#ws-crumb').textContent = crumb;
  $('#ws-prog').textContent = `阶段 ${s}/7`;
  $('#ws-status').innerHTML = `<span class="badge ${statusBadge(WS.task.status)}"><span class="b-dot"></span>${WS.task.status}</span>`;

  if(s===1){ WS.inCompany=false; renderTaskInfo(); }
  else if(s===2){ WS.inCompany=false; renderCompanyForm(); }
  else if(s===3){ WS.inCompany=false; renderScreen(); }
  else if(s===4){ WS.inCompany=false; renderMaterials(); }
  else if(s===5){ WS.inCompany=false; renderAnalysis(); }

}

/* ================= 事件 ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const id = el.dataset.id;

  if(a==='goto-backend'){ gotoBackend('tasks'); }
  else if(a==='tab-tasks'){ gotoBackend('tasks'); }
  else if(a==='tab-reports'){ gotoBackend('reports'); }
  else if(a==='back-dash'){ showView('view-dashboard'); }
  else if(a==='new-task'){ $('#new-task-modal').classList.add('show'); $('#nt-name').focus(); }
  else if(a==='close-new-task'){ $('#new-task-modal').classList.remove('show'); }
  else if(a==='submit-new-task'){
    const name = $('#nt-name').value.trim() || '未命名任务';
    const note = $('#nt-note').value.trim() || '—';
    TASKS.unshift({id:'t'+Date.now(),name,note,companies:0,status:'待初筛',time:fmtNow(),stage:1,round:1,risk:{'观察':0,'萤火':0,'燧烟':0,'岂火':0,'积薪':0}});
    $('#new-task-modal').classList.remove('show');
    $('#nt-name').value=''; $('#nt-note').value='';
    UI.taskFilter='全部';
    renderTasks(); openTask(TASKS[0].id);
    toast('已创建任务：'+name);
  }
  else if(a==='open-task'){ openTask(id); }
  else if(a==='filter-task'){ UI.taskFilter=el.dataset.status; UI.selTasks=[]; renderTasks(); }
  else if(a==='toggle-select-task'){
    const tid=el.dataset.id;
    const p=UI.selTasks.indexOf(tid);
    if(p>=0) UI.selTasks.splice(p,1); else UI.selTasks.push(tid);
    const on=UI.selTasks.includes(tid);
    el.classList.toggle('on', on);
    el.textContent = on?'✓':'';
    const del=$('#panel-tasks [data-action="delete-tasks"]');
    if(del){ del.disabled = !UI.selTasks.length; del.textContent = '删除任务'+(UI.selTasks.length?'（'+UI.selTasks.length+'）':''); }
  }
  else if(a==='delete-tasks'){
    const n=UI.selTasks.length; if(!n) return;
    if(!confirm('确定删除选中的 '+n+' 个任务？此操作不可恢复。')) return;
    TASKS = TASKS.filter(t=>!UI.selTasks.includes(t.id));
    UI.selTasks=[];
    renderTasks();
    toast('已删除 '+n+' 个任务');
  }
  else if(a==='back-tasks'){ gotoBackend('tasks'); }
  else if(a==='stage'){ const n=+el.dataset.stage; if(el.classList.contains('lock')) return; WS.stage=n; WS.company=0; WS.inCompany=false; WS.selected=[]; renderStageList(); renderCanvas(); }
  else if(a==='goto'){
    WS.stage=+el.dataset.stage;
    if(WS.stage===7) WS.task.status='已完成';
    else if(WS.stage<=6 && WS.task.status==='已完成') WS.task.status='研判中';
    WS.company=0; WS.inCompany=false; WS.selected=[]; renderStageList(); renderCanvas();
  }
  else if(a==='upload-form'){ WS.formUploaded=true; renderCanvas(); toast('已上传企业清单，解析 '+COMPANY_FORM.length+' 家企业'); }
  else if(a==='reupload-form'){ WS.formUploaded=false; renderCanvas(); }
  else if(a==='toggle-cand'){
    const i=+el.dataset.i; WS.candidates[i].on=!WS.candidates[i].on;
    el.classList.toggle('on',WS.candidates[i].on);
    const checked=WS.candidates.filter(c=>c.on).length;
    const b=$('#ws-canvas .badge.b-neutral'); if(b) b.textContent=`已采纳 ${checked} / ${WS.candidates.length} 家`;
    const btn=$('#ws-canvas [data-action="confirm-cand"]'); if(btn) btn.textContent=`确认清单（${checked} 家）并进入上传材料`;
  }
  else if(a==='reset-cand'){ WS.candidates.forEach(c=>c.on=true); renderCanvas(); }
  else if(a==='confirm-cand'){
    const n=WS.candidates.filter(c=>c.on).length;
    if(n===0){ toast('请至少采纳一家企业'); return; }
    WS.task.companies=n; WS.task.status='研判中'; WS.screened=true;
    WS.stage=4; WS.company=0; WS.inCompany=false;
    toast('已采纳 '+n+' 家企业（剔除 '+(WS.candidates.length-n)+' 家多余数据），进入上传材料');
    renderStageList(); renderCanvas();
  }
  else if(a==='start-analysis'){ WS.stage=5; WS.company=0; renderStageList(); renderCanvas(); toast('研判作业已完成（第 '+WS.round+' 轮），共抽取 '+COMPANIES.reduce((x,c)=>x+(+c.facts.split('/')[0]||0),0)+' 条事实'); }
  else if(a==='open-company'){ WS.company=+el.dataset.i; WS.inCompany=true; renderCanvas(); }
  else if(a==='back-review'){ WS.inCompany=false; renderCanvas(); }
  else if(a==='prev-company'){ if(WS.company>0){WS.company--;renderCanvas();} }
  else if(a==='next-company'){ if(WS.company<COMPANIES.length-1){WS.company++;renderCanvas();} }
  else if(a==='toggle-dim'){ el.classList.toggle('open'); }
  else if(a==='select-company'){
    const i=+el.dataset.i; if(COMPANIES[i].review!=='待审核') return;
    const p=WS.selected.indexOf(i);
    if(p>=0) WS.selected.splice(p,1); else WS.selected.push(i);
    renderReview();
  }
  else if(a==='select-all'){
    const all=COMPANIES.map((c,i)=>i).filter(i=>COMPANIES[i].review==='待审核');
    const allSel=all.length>0 && all.every(i=>WS.selected.includes(i));
    WS.selected = allSel ? [] : all.slice();
    renderReview();
  }
  else if(a==='batch-pass'){
    const n=WS.selected.length; if(!n) return;
    WS.selected.forEach(i=>{ if(COMPANIES[i].review==='待审核') COMPANIES[i].review='已审核'; });
    WS.selected=[];
    toast('已批量通过 '+n+' 家企业');
    renderReview();
  }
  else if(a==='batch-miss'){
    const n=WS.selected.length; if(!n) return;
    WS.selected.forEach(i=>{ if(COMPANIES[i].review==='待审核') COMPANIES[i].review='缺材料'; });
    WS.selected=[];
    toast('已将 '+n+' 家企业标记为缺材料');
    renderReview();
  }
  else if(a==='quick-pass'){
    const i=+el.dataset.i; COMPANIES[i].review='已审核';
    WS.selected=WS.selected.filter(x=>x!==i);
    toast('已通过：'+COMPANIES[i].n);
    renderReview();
  }
  else if(a==='save-company'){ COMPANIES[WS.company].review='已审核'; WS.selected=WS.selected.filter(i=>i!==WS.company); toast('已标记已审核：'+COMPANIES[WS.company].n); renderCanvas(); }
  else if(a==='score-company'){ COMPANIES[WS.company].review='已审核'; WS.selected=WS.selected.filter(i=>i!==WS.company); toast('已确认并提交评分：'+COMPANIES[WS.company].n+' · 烽火指数 '+COMPANIES[WS.company].score); renderCanvas(); }
  else if(a==='export-report'){ toast('导出报告：'+COMPANIES[+el.dataset.i].n+'（演示，未实际下载）'); }
  else if(a==='view-report'){ toast('查看报告：'+el.dataset.company+'（演示）'); }
  else if(a==='download-report'){ toast('下载报告：'+el.dataset.company+'（演示，未实际下载）'); }
  else if(a==='reset-filter'){ FILTER={task:'全部',risk:'全部',round:'全部',range:'全部',kw:''}; renderReports(); }
  else if(a==='new-round'){
    WS.round++; WS.task.round=WS.round; WS.task.status='研判中';
    COMPANIES.forEach(c=>c.review='待审核');
    WS.stage=4; WS.company=0; WS.inCompany=false;
    toast('已开始第 '+WS.round+' 轮：上一轮结果已归档覆盖，请上传新材料');
    renderStageList(); renderCanvas();
  }
  else if(a==='round-history'){ renderHistory(); }
  else if(a==='close-history'){ $('#history-modal').classList.remove('show'); }
  else if(a==='supplement-upload'){ openSupplement(); }
  else if(a==='close-supplement'){ $('#supplement-modal').classList.remove('show'); }
  else if(a==='sup-mode'){ SUP.mode=el.dataset.mode; renderSupplementMode(); }
  else if(a==='sup-file'){ SUP.fileIdx=(SUP.fileIdx+1)%SUP_FILES.length; renderSupplementFile(); }
  else if(a==='submit-supplement'){ submitSupplement(); }
  else if(a==='hist-view'){ el.closest('.hist-row').classList.toggle('open'); }
});

/* 筛选器 change / input */
document.addEventListener('change', e=>{
  if(e.target.id==='sup-cat'){ SUP.cat=e.target.value; return; }
  if(e.target.dataset.taskRange!==undefined){ UI.timeRange=e.target.value; renderTasks(); return; }
  const el = e.target.closest('[data-filter]');
  if(!el || el.dataset.filter==='kw') return;
  FILTER[el.dataset.filter] = el.value;
  renderReportList();
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-filter="kw"]');
  if(!el) return;
  FILTER.kw = el.value;
  renderReportList();
});

/* 初始化 */
showView('view-dashboard');
</script>
</body>
</html>
