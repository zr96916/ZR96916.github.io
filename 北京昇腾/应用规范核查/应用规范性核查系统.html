<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>违规处置工作台 · 规范性核查系统</title>
<style>
:root{
  --bg-deep:#e8f6fc;--bg-panel:#fff;--bg-card:#f4fbff;
  --blue-jc:#1a8fd0;--blue-electric:#2bb4e8;--blue-deep:#0d6eab;
  --cyan:#1ab4e8;--cyan-dim:#5ec8ef;
  --gold:#e09b00;--gold-bright:#f0b429;
  --red:#e53935;--red-glow:#ef5350;
  --green:#2bbbad;--green-glow:#4db6ac;--orange:#fb8c00;
  --hud-line:#b5e3f4;--hud-bright:#64c8ec;
  --text-primary:#1a4f7a;--text-secondary:#3d7eab;--text-dim:#7aa8c4;
  --sidebar-w:240px;--glass:#ffffffc7;--glass-strong:#ffffffeb;--tint:#1ea0d214;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;color:var(--text-primary);
  background:radial-gradient(at 50% 42%,#78d7ff8c 0%,#e8f6fc33 46%,#0000 72%),linear-gradient(#d4eef8 0%,#eaf6fc 42%,#dceef8 100%);
  font-family:Microsoft YaHei,PingFang SC,Helvetica Neue,sans-serif;font-size:13px;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:0 0}
::-webkit-scrollbar-thumb{background:var(--hud-bright);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan-dim)}
@keyframes fadeIn{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{0%{transform:translate(100%)}to{transform:translate(0)}}
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.18)}to{transform:scale(1)}}
@keyframes glowPulse{0%,to{box-shadow:0 0 8px #00e5ff4d}50%{box-shadow:0 0 20px #00e5ffb3}}
@keyframes pulse{0%,to{opacity:1}50%{opacity:.4}}

/* ============ 侧边栏 ============ */
#sidebar{background:linear-gradient(180deg,#ffffffd9,#eaf6fcf2);border-right:1px solid var(--hud-line);backdrop-filter:blur(14px);width:var(--sidebar-w);height:100%;flex-direction:column;display:flex;position:relative;z-index:200;transition:width .3s}
#sidebar.collapsed{width:64px}
.sb-header{border-bottom:1px solid #1ea0d280;align-items:center;gap:10px;padding:16px 14px;display:flex}
.sb-logo{background:linear-gradient(135deg,var(--blue-jc),var(--cyan-dim));border-radius:6px;flex-shrink:0;justify-content:center;align-items:center;width:30px;height:30px;font-size:16px;display:flex;box-shadow:0 0 12px #00e5ff4d}
.sb-title-wrap{white-space:nowrap;overflow:hidden}
.sb-title{color:var(--text-primary);letter-spacing:1px;font-size:13px;font-weight:700}
.sb-subtitle{color:var(--text-dim);letter-spacing:2px;font-size:9px}
#sidebar.collapsed .sb-title-wrap{display:none}
.sb-toggle{border:1px solid var(--hud-line);background:#ffffff9e;color:var(--text-secondary);cursor:pointer;border-radius:50%;width:22px;height:22px;font-size:10px;position:absolute;right:-11px;top:64px;transition:all .3s}
.sb-toggle:hover{color:var(--blue-deep);border-color:var(--hud-bright)}
nav{flex:1;padding-top:8px;overflow:hidden auto}
.nav-group-label{color:var(--text-dim);letter-spacing:2px;white-space:nowrap;padding:10px 14px 4px;font-size:9px}
#sidebar.collapsed .nav-group-label{text-align:center;padding:10px 4px 4px;font-size:8px}
.nav-item{cursor:pointer;color:var(--text-secondary);white-space:nowrap;border-radius:4px;align-items:center;gap:10px;margin:1px 8px;padding:10px 14px;font-size:12px;transition:all .25s;display:flex;position:relative}
.nav-item:hover{color:var(--blue-deep);background:#2196f31a}
.nav-item.active{color:var(--blue-deep);border-left:2px solid var(--cyan);background:linear-gradient(90deg,#1ab4e829,#2196f30f);box-shadow:inset 0 0 12px #1ab4e80f}
.nav-item .ni-icon{text-align:center;flex-shrink:0;width:18px;font-size:14px}
#sidebar.collapsed .nav-item{justify-content:center;gap:0;margin:1px 6px;padding:10px 6px}
#sidebar.collapsed .ni-label{display:none}
.nav-badge{background:var(--red-glow);color:#fff;border-radius:9px;padding:0 7px;font-size:10px;font-weight:700;line-height:16px;margin-left:auto}
#sidebar.collapsed .nav-badge{display:none}
.sb-footer{border-top:1px solid #1ea0d280;padding:12px 14px;display:flex;align-items:center;gap:10px}
.sb-user-avatar{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;border-radius:50%;flex-shrink:0;justify-content:center;align-items:center;width:28px;height:28px;font-size:11px;font-weight:700;display:flex}
.sb-user-name{color:var(--text-primary);font-size:12px;font-weight:600;line-height:1.4}
.sb-user-meta{color:var(--text-dim);font-size:9px;line-height:1.4}
#sidebar.collapsed .sb-user-info{display:none}
.logout-btn{border:1px solid var(--hud-line);background:0 0;color:var(--text-dim);cursor:pointer;border-radius:3px;padding:3px 8px;font-size:9px;margin-left:auto;transition:all .25s}
.logout-btn:hover{color:var(--red-glow);border-color:var(--red-glow)}
#sidebar.collapsed .logout-btn{display:none}

/* ============ 主区域 ============ */
#main-area{flex:1;min-width:0;height:100%;flex-direction:column;display:flex;position:relative;z-index:1}
#app{display:flex;height:100%}
#header{border-bottom:1px solid var(--hud-line);z-index:150;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:#ffffff9e;flex-shrink:0;justify-content:space-between;align-items:center;height:54px;padding:0 20px;display:flex;position:relative}
#header:after{content:"";background:linear-gradient(90deg,transparent,var(--cyan-dim),var(--cyan),var(--cyan-dim),transparent);width:80%;height:1px;position:absolute;bottom:-1px;left:10%}
.header-title{letter-spacing:2px;color:#1565c0;font-size:19px;font-weight:700}
.header-user{color:var(--text-primary);align-items:center;gap:6px;display:flex}
.hu-avatar{background:linear-gradient(135deg,var(--gold),var(--orange));color:#000;border-radius:50%;flex-shrink:0;justify-content:center;align-items:center;width:28px;height:28px;font-size:11px;font-weight:700;display:flex}
.hu-name{font-size:12px;font-weight:600}
.hu-meta{font-size:9px;color:var(--text-dim)}
.content{flex:1;min-height:0;flex-direction:column;gap:12px;padding:14px 18px 16px;display:flex;overflow:auto}

/* 步骤头 */
.page-step-header{border:1px solid var(--hud-line);background:linear-gradient(90deg,#2196f31f,#fff6);border-radius:6px;flex-shrink:0;align-items:center;gap:14px;padding:12px 18px;display:flex;animation:.4s fadeIn}
.step-num{background:linear-gradient(135deg,var(--blue-jc),var(--cyan-dim));color:#fff;border-radius:50%;flex-shrink:0;justify-content:center;align-items:center;width:36px;height:36px;font-size:16px;font-weight:700;display:flex}
.psh-title{color:var(--text-primary);font-size:15px;font-weight:700}
.psh-sub{color:var(--text-dim);margin-top:2px;font-size:11px}
.psh-right{margin-left:auto;text-align:right}
.psh-right .r1{font-size:11px;color:var(--text-secondary)}
.psh-right .r2{font-size:10px;color:var(--text-dim)}

/* HUD 面板 */
.hud-panel{background:var(--glass);border:1px solid var(--hud-line);clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px));flex-direction:column;display:flex;position:relative;box-shadow:0 8px 24px #50aadc14}
.hud-panel .corner{border-color:var(--cyan);z-index:3;pointer-events:none;border-style:solid;width:12px;height:12px;position:absolute}
.hud-panel .corner.tl{border-width:2px 0 0 2px;top:-1px;left:-1px}
.hud-panel .corner.tr{border-width:2px 2px 0 0;top:-1px;right:-1px}
.hud-panel .corner.bl{border-width:0 0 2px 2px;bottom:-1px;left:-1px}
.hud-panel .corner.br{border-width:0 2px 2px 0;bottom:-1px;right:-1px}
.panel-title{color:var(--text-secondary);letter-spacing:1px;flex-shrink:0;align-items:center;gap:8px;padding:10px 14px 6px;font-size:11px;font-weight:600;display:flex}
.panel-actions{gap:8px;margin-left:auto;display:flex;align-items:center}
.panel-inner{z-index:1;flex-direction:column;flex:1;min-height:0;padding:0 10px 10px;display:flex;position:relative}

/* 状态 tabs（沿用上级系统 sync-tab 样式） */
.sync-tabs{flex-wrap:wrap;gap:6px;margin-bottom:12px;display:flex}
.sync-tab{color:var(--text-dim);border:1px solid var(--hud-line);cursor:pointer;white-space:nowrap;background:#1ea0d240;border-radius:6px;padding:7px 16px;font-size:11px;transition:all .25s}
.sync-tab:hover{color:var(--text-primary);border-color:var(--hud-bright)}
.sync-tab .cnt{font-weight:700;margin-left:2px}
.sync-tab.active{border-color:var(--cyan);color:var(--cyan);background:#00e5ff1f;font-weight:600}
.sync-tab.active.danger{border-color:var(--red);color:var(--red-glow);background:#ff17441f}
.sync-tab.active.gold{border-color:var(--gold);color:var(--gold-bright);background:#ffc1071f}
.sync-tab.active.blue{border-color:var(--blue-electric);color:var(--blue-electric);background:#2196f31f}
.sync-tab.active.green{border-color:var(--green);color:var(--green-glow);background:#00e6761f}

/* 标签 */
.tag{border-radius:3px;padding:1px 8px;font-size:10px;font-weight:700;line-height:1.6;display:inline-block}
.tag-g{color:var(--green-glow);background:#00e67629;border:1px solid #00e67666}
.tag-r{color:var(--red-glow);background:#ff174429;border:1px solid #ff174466}
.tag-o{color:var(--gold-bright);background:#ffc10729;border:1px solid #ffc10766}
.tag-b{color:var(--blue-electric);background:#2196f329;border:1px solid #2196f366}

/* 台账列表 */
.ledger-panel{flex:1;min-height:220px;display:flex;flex-direction:column}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.flt-sel,.flt-input{background:var(--bg-panel);border:1px solid var(--hud-line);border-radius:4px;padding:6px 10px;color:var(--text-primary);font-size:11px;outline:0}
.flt-sel:focus,.flt-input:focus{border-color:var(--hud-bright)}
.flt-input{width:190px}
.review-btn{cursor:pointer;border:1px solid var(--hud-line);color:var(--text-secondary);background:#1ea0d266;border-radius:4px;padding:6px 12px;font-size:11px;transition:all .25s}
.review-btn:hover{color:var(--blue-deep);border-color:var(--hud-bright)}
.review-btn.primary{background:linear-gradient(135deg,var(--blue-jc),var(--blue-electric));color:#fff;border-color:#0000;font-weight:600}
.review-btn.primary:hover{filter:brightness(1.08)}
.panel-action-btn{border:1px solid var(--hud-line);color:var(--text-secondary);cursor:pointer;background:0 0;border-radius:3px;padding:3px 10px;font-size:10px;transition:all .3s}
.panel-action-btn:hover{color:var(--blue-deep);border-color:var(--hud-bright)}
.flt-count{margin-left:auto;font-size:11px;color:var(--text-dim)}
.table-wrap{flex:1;min-height:0;overflow:auto}
.data-table{border-collapse:collapse;width:100%;font-size:11px}
.data-table th{color:var(--text-primary);text-align:left;border-bottom:1px solid var(--hud-line);white-space:nowrap;background:#1ea0d266;padding:8px 10px;font-weight:500;position:sticky;top:0;z-index:1}
.data-table td{color:var(--text-secondary);border-bottom:1px solid #1ea0d24d;padding:7px 10px}
.data-table tbody tr{cursor:pointer;transition:background .2s}
.data-table tbody tr:hover td{color:var(--text-primary);background:#2196f314}
.mono{font-family:Consolas,Microsoft YaHei,monospace;letter-spacing:.3px}
.link-btn{cursor:pointer;border:1px solid var(--hud-line);background:#1ea0d21f;color:var(--blue-deep);border-radius:3px;padding:2px 10px;font-size:10px;transition:all .25s}
.link-btn:hover{background:#1ea0d24d;border-color:var(--hud-bright)}

/* ============ 详情抽屉 ============ */
.drawer-mask{position:fixed;inset:0;background:#0d3c5c4d;z-index:900;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:var(--glass-strong);backdrop-filter:blur(18px);border-left:1px solid var(--hud-line);z-index:901;transform:translate(100%);transition:transform .35s cubic-bezier(.22,.8,.32,1);display:flex;flex-direction:column;box-shadow:-12px 0 40px #50aadc26}
.drawer.show{transform:translate(0)}
.drawer-head{border-bottom:1px solid var(--hud-line);padding:16px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative}
.drawer-head:after{content:"";background:linear-gradient(90deg,transparent,var(--cyan-dim),var(--cyan),var(--cyan-dim),transparent);width:90%;height:1px;position:absolute;bottom:-1px;left:5%}
.dw-title{font-size:14px;font-weight:700;color:var(--text-primary)}
.dw-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.drawer-close{margin-left:auto;cursor:pointer;border:1px solid var(--hud-line);background:0 0;color:var(--text-dim);border-radius:50%;width:26px;height:26px;font-size:12px;transition:all .25s}
.drawer-close:hover{color:var(--red-glow);border-color:var(--red-glow)}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px}
.sec-title{color:var(--text-secondary);letter-spacing:1px;font-size:11px;font-weight:700;padding:8px 0 6px;display:flex;align-items:center;gap:6px}
.sec-title .st-ico{color:var(--cyan)}
.info-grid{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:11px}
.info-grid .k{color:var(--text-dim);text-align:right;padding:2px 0}
.info-grid .v{color:var(--text-primary);padding:2px 0;font-weight:500}
.info-grid .v.hl-red{color:var(--red-glow);font-weight:700}
.mismatch-pair{display:flex;gap:8px;align-items:center;font-size:11px;margin:2px 0}
.mp-box{flex:1;border:1px solid var(--hud-line);border-radius:4px;padding:5px 8px;background:#f4fbff}
.mp-box .mp-k{font-size:9px;color:var(--text-dim)}
.mp-box .mp-v{font-size:11px;font-weight:700;color:var(--text-primary)}
.mp-box.bad{border-color:#ff174466;background:#ff17440d}
.mp-box.bad .mp-v{color:var(--red-glow)}
.mp-arrow{color:var(--red-glow);font-weight:700;font-size:13px}
.judge-quote{border:1px solid var(--hud-line);border-left:3px solid var(--red-glow);background:#ff174408;border-radius:4px;padding:8px 10px;font-size:11px;color:var(--text-secondary);line-height:1.7}
.judge-quote b{color:var(--red-glow)}

/* 流转时间轴（横向四步） */
.flow-track{display:flex;align-items:flex-start;margin:14px 6px 4px}
.flow-node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.flow-node:not(:first-child):before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:#1ea0d25e}
.flow-node.done:not(:first-child):before{background:linear-gradient(90deg,var(--cyan-dim),var(--cyan))}
.fn-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--hud-line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-dim);position:relative;z-index:2;transition:all .3s}
.flow-node.done .fn-dot{border-color:var(--cyan);color:#fff;background:linear-gradient(135deg,var(--blue-jc),var(--cyan))}
.flow-node.current .fn-dot{border-color:var(--gold-bright);color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-bright));animation:glowPulse 2s infinite}
.flow-node.pend .fn-dot{border-style:dashed}
.fn-label{margin-top:6px;font-size:11px;font-weight:700;color:var(--text-secondary)}
.flow-node.current .fn-label{color:var(--gold-bright)}
.flow-node.pend .fn-label{color:var(--text-dim);font-weight:400}
.fn-meta{margin-top:2px;font-size:9px;color:var(--text-dim);line-height:1.5}
.fn-meta b{color:var(--text-secondary);font-weight:500}

/* 时间轴明细 */
.trace-list{margin-top:8px;border-left:2px solid var(--hud-line);margin-left:8px;padding-left:14px}
.trace-item{position:relative;padding-bottom:12px;font-size:11px}
.trace-item:before{content:"";position:absolute;left:-19px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px #1ab4e866}
.trace-item.ti-pend:before{background:var(--hud-line);box-shadow:none}
.trace-item .ti-time{color:var(--text-dim);font-size:9px;margin-right:8px}
.trace-item .ti-txt{color:var(--text-secondary)}
.trace-item .ti-op{color:var(--text-primary);font-weight:600}
.trace-item.ti-pend .ti-txt{color:var(--text-dim)}

/* 整改操作区 */
.action-card{border:1px solid var(--hud-line);border-radius:6px;padding:12px;margin-top:12px;background:linear-gradient(180deg,#2196f30d,#fff6)}
.action-card.pending{border-color:#ff174466}
.action-card.acting{border-color:#ffc10766}
.action-card.waiting{border-color:#2196f366}
.action-card.closed{border-color:#00e67666}
.ac-title{font-size:12px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.ac-hint{font-size:10px;color:var(--text-dim);margin-left:auto;font-weight:400}
.ac-status-row{font-size:11px;color:var(--text-secondary);display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.ac-status-row b{color:var(--text-primary)}
.rw-btn{cursor:pointer;width:100%;color:var(--text-primary);border:1px solid var(--hud-line);background:#1ea0d214;border-radius:5px;padding:10px 12px;font-size:12px;font-weight:700;transition:all .25s;margin-top:8px}
.rw-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px #0000001f}
.rw-btn-start{color:var(--gold-bright);background:#ffc1071f;border-color:#ffc10780}
.rw-btn-start:hover{background:#ffc1073d}
.rw-btn-submit{color:var(--green-glow);background:#00e67624;border-color:#00e67680}
.rw-btn-submit:hover{background:#00e6763d}
.rw-btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.rw-textarea{width:100%;background:#fff;border:1px solid var(--hud-line);border-radius:4px;padding:8px 10px;font-size:11px;color:var(--text-primary);font-family:inherit;resize:vertical;min-height:70px;outline:0;line-height:1.6}
.rw-textarea:focus{border-color:var(--hud-bright);box-shadow:0 0 0 2px #1ea0d233}
.rw-textarea-label{font-size:10px;color:var(--text-dim);margin:10px 0 4px}
.readonly-banner{border:1px dashed var(--hud-line);border-radius:4px;padding:8px 10px;font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px}

/* toast */
#toast{position:fixed;top:66px;right:24px;z-index:999;background:linear-gradient(135deg,var(--blue-jc),var(--blue-electric));color:#fff;border-radius:6px;padding:10px 18px;font-size:12px;font-weight:600;box-shadow:0 8px 24px #1a8fd066;display:none;animation:.35s fadeInUp}
#toast.warn{background:linear-gradient(135deg,var(--gold),var(--orange))}
#toast.err{background:linear-gradient(135deg,var(--red),var(--red-glow))}

.empty-tip{text-align:center;color:var(--text-dim);font-size:11px;padding:30px 0}
</style>
</head>
<body>
<div id="app">

  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">⚖️</div>
      <div class="sb-title-wrap">
        <div class="sb-title">规范性核查系统</div>
        <div class="sb-subtitle">北京市人民检察院</div>
      </div>
    </div>
    <button class="sb-toggle" id="sb-toggle" onclick="toggleSidebar()">◀</button>
    <nav>
      <div class="nav-group-label">🚨 违规处置</div>
      <div class="nav-item active"><span class="ni-icon">📋</span><span class="ni-label">违规项目列表</span><span class="nav-badge" id="nav-badge">0</span></div>
    </nav>
    <div class="sb-footer">
      <div class="sb-user-avatar">赵</div>
      <div class="sb-user-info">
        <div class="sb-user-name">赵志强</div>
        <div class="sb-user-meta">朝阳院 · 承办员</div>
      </div>
      <button class="logout-btn" onclick="showToast('原型演示：退出登录','warn')">退出</button>
    </div>
  </aside>

  <!-- 主区域 -->
  <div id="main-area">
    <header id="header">
      <div class="header-left"></div>
      <div class="header-title-wrap">
        <div class="header-title">大数据法律监督模型应用规范性核查系统</div>
      </div>
      <div class="header-right">
        <span class="header-user">
          <span class="hu-avatar">赵</span>

/* ============ 状态口径 ============ */
var STATUS_META = {
  PENDING:        { label:'待处置',   tag:'tag-r', flow:0, css:'var(--red)' },
  IN_PROGRESS:    { label:'整改中',   tag:'tag-o', flow:1, css:'var(--gold-bright)' },
  SUBMITTED:      { label:'已整改 · 待上级审批', tag:'tag-b', flow:2, css:'var(--blue-electric)' },
  MUNICIPAL_REVIEW:{label:'上级审批中', tag:'tag-b', flow:2, css:'var(--blue-electric)' },
  APPROVED:       { label:'审批通过', tag:'tag-g', flow:3, css:'var(--green-glow)' },
  CLOSED:         { label:'已闭环',   tag:'tag-g', flow:3, css:'var(--green-glow)' }
};
var FLOW_STEPS = ['收到工单','提交处置','上级审批','完成闭环'];
var PROBLEM_COLORS = {'案件类别不符':'var(--red-glow)','案件来源不符':'var(--gold-bright)','案件模型关联不实':'var(--blue-electric)','其他不符合':'var(--cyan)'};

/* ============ 工具 ============ */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var toastTimer=null;
function showToast(msg,type){
  var t=$('toast');t.textContent=msg;t.className=type||'';t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none'},2600);
}
function toggleSidebar(){
  var sb=$('sidebar');sb.classList.toggle('collapsed');
  $('sb-toggle').textContent=sb.classList.contains('collapsed')?'▶':'◀';
}

/* ============ 状态 tabs（全部/各分项） ============ */
var currentStatusFilter='';
var TAB_DEFS=[
  {key:'',           label:'全部',       cls:''},
  {key:'PENDING',    label:'待处置',     cls:'danger'},
  {key:'IN_PROGRESS',label:'整改中',     cls:'gold'},
  {key:'SUBMITTED',  label:'待上级审批', cls:'blue'},
  {key:'CLOSED',     label:'已闭环',     cls:'green'}
];
function renderTabs(){
  var cnt={ALL:0,PENDING:0,IN_PROGRESS:0,SUBMITTED:0,CLOSED:0};
  WORK_ORDERS.forEach(function(w){
    cnt.ALL++;
    if(w.status==='PENDING')cnt.PENDING++;
    else if(w.status==='IN_PROGRESS')cnt.IN_PROGRESS++;
    else if(w.status==='SUBMITTED'||w.status==='MUNICIPAL_REVIEW')cnt.SUBMITTED++;
    else if(w.status==='CLOSED')cnt.CLOSED++;
  });
  var html='';
  TAB_DEFS.forEach(function(t){
    var n = t.key===''?cnt.ALL:cnt[t.key];
    html+='<div class="sync-tab'+(currentStatusFilter===t.key&&t.cls!==''?' active '+t.cls:(currentStatusFilter===t.key?' active':''))
      +'" onclick="switchStatusTab(\''+t.key+'\')">'+t.label+' <span class="cnt">'+n+'</span></div>';
  });
  $('status-tabs').innerHTML=html;
  $('nav-badge').textContent=cnt.PENDING+cnt.IN_PROGRESS+cnt.SUBMITTED;
}
function switchStatusTab(key){
  currentStatusFilter=(currentStatusFilter===key)?'':key;
  renderTabs();renderTable();
}

/* ============ 筛选 ============ */
function resetFilter(){
  currentStatusFilter='';$('flt-type').value='';$('flt-kw').value='';
  renderTabs();renderTable();showToast('已重置筛选');
}
function applyFilter(list){
  var tp=$('flt-type').value, kw=$('flt-kw').value.trim().toLowerCase();
  return list.filter(function(w){
    var wst = w.status==='MUNICIPAL_REVIEW'?'SUBMITTED':w.status;
    if(currentStatusFilter && wst!==currentStatusFilter)return false;
    if(tp && w.problemType!==tp)return false;
    if(kw && w.caseNo.toLowerCase().indexOf(kw)<0 && w.id.toLowerCase().indexOf(kw)<0)return false;
    return true;
  });
}

/* ============ 台账表格 ============ */
function statusTag(w){
  var m=STATUS_META[w.status];
  var label = w.status==='MUNICIPAL_REVIEW'?'上级审批中':m.label;
  return '<span class="tag '+m.tag+'">'+label+'</span>';
}
function flowLabel(w){
  var f=STATUS_META[w.status].flow;
  return FLOW_STEPS[f];
}
function renderTable(){
  var list=applyFilter(WORK_ORDERS);
  var tb=$('ledger-tbody');tb.innerHTML='';
  $('empty-tip').style.display=list.length?'none':'block';
  $('flt-count').textContent='共 '+list.length+' 条';
  list.forEach(function(w){
    var tr=document.createElement('tr');
    var op = w.status==='PENDING'||w.status==='IN_PROGRESS'
      ? '<button class="link-btn" onclick="event.stopPropagation();openDrawer(\''+w.id+'\')">处置</button>'
      : '<button class="link-btn" onclick="event.stopPropagation();openDrawer(\''+w.id+'\')">查看</button>';
    tr.innerHTML='<td class="mono">'+w.id+'</td>'
      +'<td class="mono">'+w.caseNo+'</td>'
      +'<td><span class="tag tag-r" style="background:'+PROBLEM_COLORS[w.problemType]+'1f;border-color:'+PROBLEM_COLORS[w.problemType]+'80;color:'+PROBLEM_COLORS[w.problemType]+'">'+w.problemType+'</span></td>'
      +'<td>'+w.model+'</td>'
      +'<td>'+w.judgeTime+'</td>'
      +'<td>'+statusTag(w)+'</td>'
      +'<td style="font-weight:600;color:var(--text-primary)">'+flowLabel(w)+'</td>'
      +'<td>'+op+'</td>';
    tr.onclick=function(){openDrawer(w.id)};
    tb.appendChild(tr);
  });
}

/* ============ 详情抽屉 ============ */
function openDrawer(id){
  var w=WORK_ORDERS.filter(function(x){return x.id===id})[0];
  if(!w)return;
  var body=$('drawer-body');
  $('dw-title').textContent=w.caseNo;
  $('dw-sub').textContent='工单编号 '+w.id+' · 承办单位：'+CURRENT_USER.org;
  $('dw-tag').innerHTML=statusTag(w);

  var flow=STATUS_META[w.status].flow;
  var nodes='';
  FLOW_STEPS.forEach(function(s,i){
    var cls = i<flow?'done':(i===flow?'current':'pend');
    var dot = i<flow?'✓':(i===flow?'●':'○');
    var meta='';
    if(i===0) meta='<b>'+w.judgeTime+'</b><br>上级判定 · '+SUPERVISORS[w.judgeBy]+'<br>交办至'+CURRENT_USER.short;
    if(i===1){
      if(w.submitTime) meta='<b>'+w.submitTime+'</b><br>承办员 '+CURRENT_USER.name+' 提交处置';
      else if(w.startTime) meta='<b>'+w.startTime+'</b><br>承办员 '+CURRENT_USER.name+' 开始整改';
      else meta='待处置 · '+CURRENT_USER.name;
    }
    if(i===2){
      if(w.approveTime) meta='<b>'+w.approveTime+'</b><br>'+SUPERVISORS[w.judgeBy]+' 审批通过';
      else if(w.reviewTime) meta='<b>'+w.reviewTime+'</b><br>'+SUPERVISORS[w.judgeBy]+' 复核中';
      else if(w.submitTime) meta='等待上级审批';
      else meta='—';
    }
    if(i===3){
      if(w.closeTime) meta='<b>'+w.closeTime+'</b><br>销号归档';
      else meta='—';
    }
    nodes+='<div class="flow-node '+cls+'">'
      +'<div class="fn-dot">'+dot+'</div>'
      +'<div class="fn-label">'+(i===flow&&w.status!=='CLOSED'&&w.status!=='APPROVED'?s+'（当前）':s)+'</div>'
      +'<div class="fn-meta">'+meta+'</div>'
      +'</div>';
  });

  var trace='';
  trace+=traceItem(w.judgeTime,'上级 <b>'+SUPERVISORS[w.judgeBy]+'</b> 第三步分层复核判定违规，写入整改台账并交办',true);
  trace+=traceItem(w.assignTime,'系统生成整改工单 <b>'+w.id+'</b>，分派至'+CURRENT_USER.short+'承办员 '+CURRENT_USER.name,true);
  if(w.startTime) trace+=traceItem(w.startTime,CURRENT_USER.name+' 开始整改（状态 → 整改中）',true);
  else trace+=traceItem('','待 '+CURRENT_USER.name+' 开始整改',false);
  if(w.submitTime) trace+=traceItem(w.submitTime,CURRENT_USER.name+' 提交处置结果（状态 → 已整改，转入上级审批）',true);
  else if(w.startTime) trace+=traceItem('','待 '+CURRENT_USER.name+' 提交处置结果',false);
  if(w.reviewTime) trace+=traceItem(w.reviewTime,'上级 '+SUPERVISORS[w.judgeBy]+' 开始复核审批',true);
  else if(w.submitTime) trace+=traceItem('','等待上级审批',false);
  if(w.approveTime) trace+=traceItem(w.approveTime,'上级审批通过：'+(w.approveNote||'同意销号'),true);
  if(w.closeTime) trace+=traceItem(w.closeTime,'工单完成闭环 · 销号归档',true);

  /* 操作区（下级仅可操作前两步） */
  var actionHtml='';
  if(w.status==='PENDING'){
    actionHtml='<div class="action-card pending">'
      +'<div class="ac-title">🛠️ 整改操作 <span class="ac-hint">当前：待处置</span></div>'
      +'<div class="ac-status-row"><span>当前状态：<b>待处置</b></span><span>判定依据：<b>'+w.problemType+'</b></span></div>'
      +'<button class="rw-btn rw-btn-start" onclick="startRectify(\''+w.id+'\')">开始整改（状态 → 整改中）</button>'
      +'</div>';
  }else if(w.status==='IN_PROGRESS'){
    actionHtml='<div class="action-card acting">'
      +'<div class="ac-title">🛠️ 整改操作 <span class="ac-hint">当前：整改中 · 开始于 '+w.startTime+'</span></div>'
      +'<div class="rw-textarea-label">整改说明（提交至上级审批，必填）</div>'
      +'<textarea class="rw-textarea" id="rect-note" placeholder="请填写整改措施、完成情况及佐证材料说明…"></textarea>'
      +'<button class="rw-btn rw-btn-submit" onclick="submitRectify(\''+w.id+'\')">提交处置结果（状态 → 已整改 · 待上级审批）</button>'
      +'</div>';
  }else if(w.status==='SUBMITTED'){
    actionHtml='<div class="action-card waiting">'
      +'<div class="ac-title">⏳ 等待上级审批 <span class="ac-hint">提交时间：'+w.submitTime+'</span></div>'
      +'<div class="readonly-banner">ℹ️ 已提交处置结果，工单已转入上级审批环节，等待'+SUPERVISORS[w.judgeBy]+'复核。审批驳回时工单将退回整改中。</div>'
      +'<div class="rw-textarea-label" style="margin-top:10px">已提交的整改说明</div>'
      +'<div class="judge-quote" style="border-left-color:var(--green-glow);background:#00e67608">'+esc(w.rectNote||'—')+'</div>'
      +'</div>';
  }else if(w.status==='MUNICIPAL_REVIEW'){
    actionHtml='<div class="action-card waiting">'
      +'<div class="ac-title">⏳ 上级审批中 <span class="ac-hint">复核开始：'+w.reviewTime+'</span></div>'
      +'<div class="readonly-banner">ℹ️ 上级已开始复核审批，请耐心等待审批结论。</div>'
      +'<div class="rw-textarea-label" style="margin-top:10px">已提交的整改说明</div>'
      +'<div class="judge-quote" style="border-left-color:var(--green-glow);background:#00e67608">'+esc(w.rectNote||'—')+'</div>'
      +'</div>';
  }else{
    actionHtml='<div class="action-card closed">'
      +'<div class="ac-title">✅ 已完成闭环 <span class="ac-hint">闭环时间：'+w.closeTime+'</span></div>'
      +'<div class="readonly-banner" style="border-color:#00e67666;color:var(--green-glow)">✔ 审批意见：'+esc(w.approveNote||'同意销号')+'</div>'
      +'<div class="rw-textarea-label" style="margin-top:10px">已提交的整改说明</div>'
      +'<div class="judge-quote" style="border-left-color:var(--green-glow);background:#00e67608">'+esc(w.rectNote||'—')+'</div>'
      +'</div>';
  }

  body.innerHTML=
    '<div class="sec-title"><span class="st-ico">①</span> 案件基本信息</div>'
    +'<div class="info-grid">'
    +'<span class="k">成案案号</span><span class="v mono">'+w.caseNo+'</span>'
    +'<span class="k">应用模型</span><span class="v">'+w.model+'</span>'
    +'<span class="k">数据来源</span><span class="v">'+w.source+'</span>'
    +'<span class="k">承办单位</span><span class="v">'+CURRENT_USER.org+'</span>'
    +'</div>'
    +'<div class="mismatch-pair" style="margin-top:8px">'
    +'<div class="mp-box bad"><div class="mp-k">实际类别（违规）</div><div class="mp-v">'+w.actual+'</div></div>'
    +'<span class="mp-arrow">➜</span>'
    +'<div class="mp-box"><div class="mp-k">应然类别（模型要求）</div><div class="mp-v">'+w.expected+'</div></div>'
    +'</div>'
    +'<div class="info-grid" style="margin-top:6px">'
    +'<span class="k">应然监督点</span><span class="v">'+w.supPoint+'</span>'
    +'</div>'

    +'<div class="sec-title" style="margin-top:14px"><span class="st-ico">②</span> 上级判定信息（第三步 · 分层复核）</div>'
    +'<div class="info-grid">'
    +'<span class="k">判定时间</span><span class="v">'+w.judgeTime+'</span>'
    +'<span class="k">判定人</span><span class="v">'+SUPERVISORS[w.judgeBy]+'</span>'
    +'<span class="k">违规问题</span><span class="v hl-red">'+w.problemType+'</span>'
    +'</div>'
    +'<div class="judge-quote" style="margin-top:6px"><b>复核意见：</b>'+w.judgeNote+'</div>'

    +'<div class="sec-title" style="margin-top:16px"><span class="st-ico">③</span> 处理进度 · 工单流转（收到 → 提交处置 → 上级审批 → 完成闭环）</div>'
    +'<div class="flow-track">'+nodes+'</div>'
    +'<div class="sec-title" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--hud-line)">流转留痕明细</div>'
    +'<div class="trace-list">'+trace+'</div>'

    +'<div class="sec-title" style="margin-top:10px"><span class="st-ico">④</span> 整改操作</div>'
    +actionHtml;

  $('drawer-mask').classList.add('show');
  $('drawer').classList.add('show');
}
function traceItem(time,txt,done){
  return '<div class="trace-item'+(done?'':' ti-pend')+'">'
    +(time?'<span class="ti-time">'+time+'</span> ':'')
    +'<span class="ti-txt">'+txt+'</span></div>';
}
function closeDrawer(){
  $('drawer-mask').classList.remove('show');
  $('drawer').classList.remove('show');
}

/* ============ 状态操作（下级仅有两个动作） ============ */
function nowStr(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function startRectify(id){
  var w=WORK_ORDERS.filter(function(x){return x.id===id})[0];
  if(!w||w.status!=='PENDING')return;
  w.status='IN_PROGRESS';w.startTime=nowStr();
  showToast('已开始整改：'+w.caseNo+'（状态 → 整改中）');
  refreshAll();openDrawer(id);
}
function submitRectify(id){
  var w=WORK_ORDERS.filter(function(x){return x.id===id})[0];
  if(!w||w.status!=='IN_PROGRESS')return;
  var note=$('rect-note').value.trim();
  if(!note){showToast('请填写整改说明后再提交','err');return;}
  if(note.length<10){showToast('整改说明过于简单，请补充整改措施与佐证情况（不少于10字）','err');return;}
  w.status='SUBMITTED';w.submitTime=nowStr();w.rectNote=note;
  showToast('处置结果已提交：'+w.caseNo+'（状态 → 已整改 · 待上级审批）');
  refreshAll();openDrawer(id);
}
function refreshAll(){renderTabs();renderTable();}

function exportLedger(){
  showToast('原型演示：台账导出 Excel（功能占位）','warn');
}

/* ============ 初始化 ============ */
(function init(){
  var sel=$('flt-type');
  Object.keys(PROBLEM_COLORS).forEach(function(k){
    var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);
  });
  renderTabs();renderTable();
})();
</script>
</body>
</html>
