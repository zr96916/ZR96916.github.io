<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧食安 · 商户端（业务闭环优化版）</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="assets/mock-data.js"></script>
<script src="assets/business-flow.js"></script>
<style>
:root{--bg:#e9e4d6;--paper:#fffdf7;--ink:#18342b;--muted:#6b766f;--line:#ddd5c3;--green:#0f4b3a;--green2:#dce9df;--orange:#d97706;--amber:#b45309;--red:#b42318;--blue:#1f6f6b;--radius:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 0,#f6f0dd,transparent 55%),var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.stage{position:relative}.phone{width:400px;height:840px;max-height:92vh;background:var(--paper);border-radius:44px;box-shadow:0 40px 90px rgba(24,52,43,.28),inset 0 0 0 6px #0e0f12;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;font-size:13px;color:var(--muted)}
.bar .time{font-weight:800;color:var(--ink)}
.head{display:flex;align-items:center;gap:12px;padding:6px 20px 14px}
.head .ava{width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}
.head b{font-size:17px}.head small{color:var(--muted);font-size:12px}
.scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:thin}
.tabbar{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:600;transition:.18s}
.tab.on{color:var(--green);background:var(--green2)}
.tab i{width:20px;height:20px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}.sec-title b{font-size:15px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.stat.hot b{color:var(--orange)}.stat.warn b{color:var(--red)}.stat.ok b{color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(24,52,43,.10)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f1ede0;color:var(--muted)}
.tag.st-pending{background:#fff1de;color:var(--amber)}.tag.st-reject{background:#fde8e6;color:var(--red)}.tag.st-review{background:#e3f0ee;color:var(--blue)}.tag.st-done{background:#e3efe3;color:var(--green)}.tag.lvl-high{background:#fde8e6;color:var(--red)}.tag.lvl-mid{background:#fff1de;color:var(--amber)}
.wo-title{font-weight:700;font-size:14px;margin:8px 0 4px}
.meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f4f0e4;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.kv{border-top:1px dashed var(--line);padding:9px 0;font-size:13px;display:flex;gap:10px}.kv .k{color:var(--muted);width:78px;flex-shrink:0}
.time{position:relative;padding-left:20px;margin-top:4px}.time::before{content:"";position:absolute;left:5px;top:12px;bottom:-4px;width:2px;background:var(--line)}.time .dot{position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--green2);border:2px solid var(--green)}
.time b{font-size:13px}.time p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:46px 16px;color:var(--muted)}.empty i{width:40px;height:40px;opacity:.4}
.fab{position:absolute;right:18px;bottom:88px;width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(15,75,58,.35);cursor:pointer;border:0}
.overlay{position:absolute;inset:0;background:rgba(16,24,20,.42);display:none;z-index:40;align-items:flex-end}.overlay.show{display:flex}
.sheet{width:100%;background:var(--paper);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .24s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:88px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn.sec{background:#fff;color:var(--green);border:1px solid var(--green)}.btn.danger{background:var(--red);color:#fff}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1}
.toast{position:fixed;top:24px;left:50%;transform:translate(-50%,-14px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:13px;opacity:0;transition:.25s;z-index:60;max-width:80vw}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--red)}
.notice{background:#fff7e6;border:1px solid #f0dcae;border-radius:14px;padding:11px 13px;font-size:12px;color:var(--amber);margin-bottom:10px}
.hint{font-size:11px;color:var(--muted);margin:6px 2px 0}
.link{color:var(--blue);font-weight:700;cursor:pointer}
.badge{background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 6px;position:absolute;margin:-16px 0 0 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage">
<div class="phone">
  <div class="bar"><span class="time" id="clock">09:41</span><span id="barTown">东桥镇 · 晨禾早点铺</span><span><i data-lucide="signal"></i><i data-lucide="wifi" style="margin-left:4px"></i></span></div>
  <div class="head">
    <div class="ava" id="ava">晨</div>
    <div style="flex:1"><b id="hName">晨禾早点铺</b><br><small id="hSub">已绑定 · 中风险</small></div>
    <button class="chip" onclick="SFSFlow&&resetAll()" title="重置演示数据"><i data-lucide="rotate-ccw"></i></button>
  </div>
  <div class="scroll" id="content"></div>
  <div class="tabbar">
    <div class="tab on" data-t="home" onclick="go('home')"><i data-lucide="layout-dashboard"></i><span>首页</span></div>
    <div class="tab" data-t="orders" onclick="go('orders')"><i data-lucide="clipboard-list"></i><span>工单</span><span id="todoBadge" class="badge" style="display:none"></span></div>
    <div class="tab" data-t="entity" onclick="go('entity')"><i data-lucide="store"></i><span>主体</span></div>
    <div class="tab" data-t="my" onclick="go('my')"><i data-lucide="user"></i><span>我的</span></div>
  </div>
  <div class="overlay" id="ov"></div>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
var MID = 'M-SX-001';
var tab = 'home', filter = 'todo', sheet = null;
var SFS = window.SFSFlow, SD = window.SFSData;
var db = () => SD.getDB();
var me = () => db().merchants.find(m => m.id === MID);
var toast = (t, err) => { var el=document.getElementById('toast'); el.textContent=t; el.className='toast show'+(err?' err':''); clearTimeout(toast._t); toast._t=setTimeout(()=>el.className='toast',2400); };
function resetAll(){ SD.resetDB(); toast('演示数据已重置'); }
function refreshIcons(){ lucide.createIcons(); }

function go(t){ tab=t; filter='todo'; sheet=null; closeOv(); render(); }
function closeOv(){ var o=document.getElementById('ov'); o.classList.remove('show'); o.innerHTML=''; }
function openSheet(html){ var o=document.getElementById('ov'); o.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>'; o.classList.add('show'); refreshIcons(); }

function statusTag(s){
  if(['待整改'].includes(s)) return '<span class="tag st-pending">待整改</span>';
  if(['驳回待补正'].includes(s)) return '<span class="tag st-reject">待补正</span>';
  if(['整改待审核','申诉审核中'].includes(s)) return '<span class="tag st-review">'+s+'</span>';
  if(['已办结'].includes(s)) return '<span class="tag st-done">已办结</span>';
  return '<span class="tag">'+s+'</span>';
}
function lvlTag(l){ return l==='高'?'<span class="tag lvl-high">高</span>':l==='中'?'<span class="tag lvl-mid">中</span>':'<span class="tag">低</span>'; }

function render(){
  var d = db(), m = me();
  var buckets = SFS.merchantBuckets(MID);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('ava').textContent = m.name.slice(0,1);
  document.getElementById('hName').textContent = m.name;
  document.getElementById('hSub').textContent = m.bindStatus + ' · ' + m.riskLevel;
  document.getElementById('barTown').textContent = m.town + ' · ' + m.name;
  var td = buckets.todo.length; document.getElementById('todoBadge').style.display = td? '':'none'; document.getElementById('todoBadge').textContent = td;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.t===tab));
  var c = document.getElementById('content');
  if(tab==='home') c.innerHTML = home(d,m,buckets);
  else if(tab==='orders') c.innerHTML = orders(d,buckets);
  else if(tab==='entity') c.innerHTML = entity(d,m);
  else c.innerHTML = my(d,m);
  refreshIcons();
}

function home(d,m,b){
  var expiring = new Date(m.licenseExpire) <= new Date('2026-09-30');
  var mine = d.approvals.filter(a=>a.merchantId===MID && a.status.startsWith('待'));
  var todoN = b.todo.length, revN = b.review.length, doneN = b.done.length;
  var latest = d.workOrders.filter(w=>w.merchantId===MID).sort((x,y)=>y.createdAt.localeCompare(x.createdAt)).slice(0,3);
  return `
  <div class="sec-title"><b>今日待办</b><span class="hint" onclick="go('orders')">全部工单 <i data-lucide="chevron-right" style="width:12px;height:12px"></i></span></div>
  <div class="statgrid">
    <div class="stat hot" onclick="go('orders')"><b>${todoN}</b><span>待我处理</span></div>
    <div class="stat" onclick="go('orders')"><b>${revN}</b><span>审核中</span></div>
    <div class="stat ok" onclick="go('orders')"><b>${doneN}</b><span>已办结</span></div>
    <div class="stat warn" onclick="go('orders')"><b>${mine.length}</b><span>审批中</span></div>
  </div>
  ${expiring?'<div class="notice" style="margin-top:12px"><i data-lucide="alert-triangle" style="width:14px;height:14px"></i> 食品经营许可证将于 <b>'+m.licenseExpire+'</b> 到期，请及时办理换证。</div>':''}
  <div class="sec-title"><b>待我处理</b></div>
  ${b.todo.length? b.todo.map(woCard).join('') : '<div class="empty"><i data-lucide="check-circle-2"></i><p>暂无待办事项</p></div>'}
  <div class="sec-title"><b>最新工单</b><span class="hint" onclick="go('orders')">查看全部</span></div>
  ${latest.map(woCard).join('')}
  <div class="sec-title"><b>快捷服务</b></div>
  <div class="row" style="flex-wrap:wrap">
    <span class="chip" onclick="openChange()"><i data-lucide="pencil"></i>主体信息变更</span>
    <span class="chip" onclick="openFeedback()"><i data-lucide="message-square"></i>意见反馈</span>
    <span class="chip" onclick="openUnbind()"><i data-lucide="unlink"></i>申请解绑</span>
  </div>`;
}

function woCard(w){
  return `<div class="card" onclick="openOrder('${w.id}')">
    <div class="spread"><span class="row">${lvlTag(w.priority)}${statusTag(w.status)}</span><span class="meta">${w.category}</span></div>
    <div class="wo-title">${w.title}</div>
    <div class="meta"><span><i data-lucide="calendar-clock" style="width:12px;height:12px"></i> 截止 ${w.dueAt}</span><span>#${w.id}</span></div>
  </div>`;
}

function orders(d,b){
  var list = d.workOrders.filter(w=>w.merchantId===MID);
  var groups = { todo:{label:'待我处理',items:b.todo}, review:{label:'审核中',items:b.review}, done:{label:'已办结',items:b.done}, all:{label:'全部',items:list} };
  var keys = ['todo','review','done','all'];
  var cur = groups[filter] || groups.all;
  return `
  <div class="filters">${keys.map(k=>`<span class="chip ${filter===k?'on':''}" onclick="setFilter('${k}')">${groups[k].label} <b>${groups[k].items.length}</b></span>`).join('')}</div>
  ${cur.items.length? cur.items.map(woCard).join('') : '<div class="empty"><i data-lucide="clipboard-list"></i><p>该状态下暂无工单</p></div>'}`;
}
function setFilter(k){ filter=k; render(); }

function entity(d,m){
  var pending = d.approvals.filter(a=>a.merchantId===MID && a.status.startsWith('待'));
  var devs = d.devices.filter(x=>m.devices.includes(x.id));
  return `
  ${pending.length?'<div class="notice"><i data-lucide="loader" style="width:14px;height:14px"></i> 有 '+pending.length+' 项申请审批中，正式档案暂不更新。</div>':''}
  <div class="card">
    <div class="spread"><b style="font-size:15px">主体档案</b><span class="link" onclick="openChange()"><i data-lucide="pencil" style="width:13px;height:13px"></i> 变更</span></div>
    <div class="kv"><span class="k">主体名称</span><span>${m.name}</span></div>
    <div class="kv"><span class="k">许可证号</span><span>${m.licenseNo}</span></div>
    <div class="kv"><span class="k">有效期至</span><span>${m.licenseExpire}</span></div>
    <div class="kv"><span class="k">负责人</span><span>${m.owner} · ${m.phone}</span></div>
    <div class="kv"><span class="k">所属镇街</span><span>${m.town} · ${m.address}</span></div>
    <div class="kv"><span class="k">风险等级</span><span>${m.riskLevel}</span></div>
  </div>
  <div class="sec-title"><b>关联设备</b></div>
  ${devs.length? devs.map(x=>`<div class="card"><div class="spread"><b>${x.name}</b>${x.status==='在线'?'<span class="tag st-done">在线</span>':x.status==='离线'?'<span class="tag st-reject">离线</span>':'<span class="tag">待关联</span>'}</div><div class="meta" style="margin-top:6px"><span>健康度 ${x.health}%</span><span>${x.id}</span></div></div>`).join('') : '<div class="empty"><i data-lucide="camera-off"></i><p>暂无关联设备</p></div>'}
  <div class="sec-title"><b>待审申请</b></div>
  ${pending.length? pending.map(a=>`<div class="card" onclick="openOrder('${a.objectId}')"><div class="spread"><b>${a.type}</b><span class="tag st-review">待审核</span></div><div class="meta" style="margin-top:6px">${a.summary}</div></div>`).join('') : '<div class="empty"><i data-lucide="file-check-2"></i><p>暂无待审申请</p></div>'}`;
}

function my(d,m){
  var nb = d.notifications.slice(0,5);
  return `
  <div class="sec-title"><b>账号与绑定</b></div>
  <div class="card"><div class="spread"><div><b>${m.name}</b><div class="meta" style="margin-top:4px">${m.bindStatus} · ${m.town}</div></div><span class="tag st-done">微信已授权</span></div></div>
  <div class="row" style="gap:10px;margin:4px 0 6px">
    <button class="btn sec" onclick="openUnbind()"><i data-lucide="unlink"></i>申请解绑</button>
    <button class="btn sec" onclick="openFeedback()"><i data-lucide="message-square"></i>意见反馈</button>
  </div>
  <div class="sec-title"><b>消息通知</b></div>
  ${nb.length? nb.map(n=>`<div class="card"><div class="spread"><span class="tag ${n.type==='warn'?'st-reject':'st-done'}">${n.type==='warn'?'提醒':'通知'}</span><span class="meta">${n.time}</span></div><p style="margin:8px 0 0;font-size:13px">${n.text}</p></div>`).join('') : '<div class="empty"><i data-lucide="bell-off"></i><p>暂无消息</p></div>'}
  <button class="btn danger" style="margin-top:8px" onclick="doLogout()"><i data-lucide="log-out"></i>退出登录</button>
  <p class="hint" style="text-align:center;margin-top:14px">智慧食安业务闭环原型 · 商户端</p>`;
}
function doLogout(){ toast('原型演示：已退出登录'); }

/* ---- 工单详情 ---- */
function openOrder(id){
  var w = db().workOrders.find(x=>x.id===id); if(!w) return;
  var actions = '';
  if(['待整改','驳回待补正'].includes(w.status)){
    actions = `<div class="btns"><button class="btn" onclick="openCorrection('${id}')"><i data-lucide="upload"></i>${w.status==='驳回待补正'?'补正材料':'提交整改'}</button><button class="btn sec" onclick="openAppeal('${id}')"><i data-lucide="scale"></i>发起申诉</button></div>`;
  }
  var evid = (w.evidence||[]).map(e=>`<div class="time"><span class="dot"></span><p>${e}</p></div>`).join('');
  var correction = w.correction? `<div class="notice" style="background:#eef5ef;border-color:#cfe3d2;color:var(--green)"><i data-lucide="check" style="width:14px;height:14px"></i> 已于 ${w.correction.submittedAt} 提交：${w.correction.text}</div>` : '';
  var appeal = w.appeal? `<div class="notice"><i data-lucide="scale" style="width:14px;height:14px"></i> 申诉中：${w.appeal.reason}</div>` : '';
  var reject = w.rejectReason? `<div class="notice" style="background:#fdeeec;border-color:#f2c6c0;color:var(--red)"><i data-lucide="x-circle" style="width:14px;height:14px"></i> 驳回原因：${w.rejectReason}</div>` : '';
  var tl = (w.timeline||[]).map(t=>`<div class="time"><span class="dot"></span><b>${t.action} · ${t.actor}</b><p>${t.note} <span style="opacity:.6">${t.time}</span></p></div>`).join('');
  openSheet(`
    <div class="spread"><span class="row">${lvlTag(w.priority)}${statusTag(w.status)}</span><span class="meta">#${w.id}</span></div>
    <h3 style="margin:10px 0 2px;font-size:18px">${w.title}</h3>
    <div class="meta" style="margin-bottom:8px"><span><i data-lucide="flag"></i> ${w.source}</span><span><i data-lucide="calendar-clock" style="width:12px;height:12px"></i> ${w.dueAt}</span></div>
    ${reject}${appeal}${correction}
    <div class="sec-title" style="margin-top:6px"><b>整改要求</b></div><p style="font-size:13px;color:#415149;margin:0">${w.requirement}</p>
    <div class="sec-title"><b>证据与来源</b></div>${evid}
    <div class="sec-title"><b>处理进度</b></div>${tl}
    ${actions}
    <button class="btn sec" style="margin-top:10px" onclick="closeOv()">关闭</button>`);
}

/* ---- 表单 ---- */
function openCorrection(id){
  openSheet(`
    <h3 style="margin:4px 0 12px">${db().workOrders.find(x=>x.id===id).status==='驳回待补正'?'补正整改材料':'提交整改'}</h3>
    <div class="field"><label>整改说明</label><textarea id="f_text" placeholder="请描述已完成的整改措施"></textarea></div>
    <div class="field"><label>整改照片 / 佐证材料</label><input id="f_img" placeholder="原型演示：输入照片描述，如「后厨口罩佩戴照片」"></div>
    <button class="btn" onclick="doCorrection('${id}')"><i data-lucide="send"></i>提交</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeOv()">取消</button>`);
}
function doCorrection(id){
  var text=document.getElementById('f_text').value, img=document.getElementById('f_img').value;
  var r = SFS.submitCorrection(id, text, img?[img]:[]);
  if(!r.ok) return toast(r.message, true);
  closeOv(); toast(r.message);
}
function openAppeal(id){
  openSheet(`
    <h3 style="margin:4px 0 12px">发起申诉</h3>
    <div class="notice"><i data-lucide="info" style="width:14px;height:14px"></i> 申诉期间工单转入「审核中」，申诉不通过将返回整改流程。</div>
    <div class="field"><label>申诉理由</label><textarea id="a_reason" placeholder="请说明认为无需整改的原因"></textarea></div>
    <div class="field"><label>佐证材料</label><input id="a_file" placeholder="输入材料描述，如「清洗记录扫描件」"></div>
    <button class="btn" onclick="doAppeal('${id}')"><i data-lucide="scale"></i>提交申诉</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeOv()">取消</button>`);
}
function doAppeal(id){
  var reason=document.getElementById('a_reason').value, f=document.getElementById('a_file').value;
  var r = SFS.submitAppeal(id, reason, f?[f]:[]);
  if(!r.ok) return toast(r.message, true);
  closeOv(); toast(r.message);
}

/* ---- 主体变更 / 解绑 / 反馈 ---- */
function openChange(){
  var m=me();
  openSheet(`
    <h3 style="margin:4px 0 12px">主体信息变更</h3>
    <div class="notice"><i data-lucide="info" style="width:14px;height:14px"></i> 变更将以「主体变更」申请提交镇级审核，通过后正式档案才更新。</div>
    <div class="field"><label>负责人姓名</label><input id="c_owner" value="${m.owner}"></div>
    <div class="field"><label>联系电话</label><input id="c_phone" value="${m.phone}"></div>
    <div class="field"><label>变更说明</label><textarea id="c_note" placeholder="简要说明变更内容"></textarea></div>
    <button class="btn" onclick="doChange()"><i data-lucide="send"></i>提交变更申请</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeOv()">取消</button>`);
}
function doChange(){
  var owner=document.getElementById('c_owner').value, phone=document.getElementById('c_phone').value, note=document.getElementById('c_note').value;
  var r = SFS.requestMerchantChange(MID, { owner, phone, summary: note||'负责人与联系方式变更' });
  if(!r.ok) return toast(r.message,true);
  closeOv(); toast(r.message);
}
function openUnbind(){
  openSheet(`
    <h3 style="margin:4px 0 12px">申请解绑</h3>
    <div class="notice"><i data-lucide="alert-triangle" style="width:14px;height:14px"></i> 存在未结工单时解绑将被阻断，需先完成整改。</div>
    <div class="field"><label>解绑设备</label><select id="u_dev">${me().devices.map(id=>`<option value="${id}">${id}</option>`).join('')||'<option>暂无可解绑设备</option>'}</select></div>
    <div class="field"><label>解绑原因</label><textarea id="u_reason" placeholder="如：设备迁移、门店闭店等"></textarea></div>
    <button class="btn" onclick="doUnbind()"><i data-lucide="unlink"></i>提交解绑申请</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeOv()">取消</button>`);
}
function doUnbind(){
  var dev=document.getElementById('u_dev').value, reason=document.getElementById('u_reason').value;
  if(!dev || dev==='暂无可解绑设备') return toast('暂无可解绑设备', true);
  var r = SFS.requestUnbind(MID, dev, reason);
  if(!r.ok) return toast(r.message,true);
  closeOv(); toast(r.message);
}
function openFeedback(){
  openSheet(`
    <h3 style="margin:4px 0 12px">意见反馈</h3>
    <div class="field"><label>反馈类型</label><select><option>监管建议</option><option>系统问题</option><option>其他</option></select></div>
    <div class="field"><label>反馈内容</label><textarea id="fb_text" placeholder="请输入您的建议或问题"></textarea></div>
    <button class="btn" onclick="doFeedback()"><i data-lucide="send"></i>提交反馈</button>
    <button class="btn sec" style="margin-top:8px" onclick="closeOv()">取消</button>`);
}
function doFeedback(){
  var t=document.getElementById('fb_text').value;
  if(!t.trim()) return toast('请输入反馈内容', true);
  var d=db(); d.notifications.unshift({id:'N-'+Date.now(),text:'已收到您的反馈：'+t,type:'success',time:new Date().toLocaleString('zh-CN',{hour12:false})}); SD.saveDB(d);
  closeOv(); toast('反馈已提交');
}

SD.subscribe(()=>render());
render();
setInterval(()=>{ if(tab==='home'){ var el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); } }, 30000);
</script>
</body>
</html>
