<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>智慧食安 · 监管端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"DM Sans"', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
        },
        colors: {
          slate: {
            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1',
            400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155',
            800: '#1E293B', 900: '#0F172A',
          },
          blue: {
            50: '#E6F1FB', 100: '#B5D4F4', 200: '#85B7EB', 300: '#6AA6DE',
            400: '#378ADD', 500: '#2C7CB8', 600: '#185FA5', 700: '#14507F',
            800: '#0C447C', 900: '#042C53',
          },
        },
      },
    },
  }
</script>
<style>
  :root {
    --accent: #185FA5;
    --navy: #0C447C;
    --border: #E2E8F0;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-elevated: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #CBD5E1;
    display: flex; justify-content: center; align-items: center;
    height: 100dvh; margin: 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .phone-frame {
    width: 100%; max-width: 430px; height: 100dvh; max-height: 932px;
    background: #F8FAFC; overflow: hidden; position: relative;
    display: flex; flex-direction: column; isolation: isolate;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 20px 60px rgba(0,0,0,0.15);
  }
  @media (min-width: 431px) {
    .phone-frame { border-radius: 28px; height: min(100dvh - 40px, 880px); }
  }
  .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  *::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.45); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }

  .app-header { background: #185FA5; }
  .app-tabbar { background: #185FA5; }

  .overlay-panel {
    position: absolute; inset: 0; background: #F8FAFC; z-index: 50;
    transform: translateY(100%); transition: transform .35s cubic-bezier(0.32,0.72,0,1);
    display: flex; flex-direction: column;
  }
  .overlay-panel.open { transform: translateY(0); }

  .toast {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: #1E293B; color: #fff; padding: 12px 22px; border-radius: 24px;
    font-size: 13px; font-weight: 500; opacity: 0;
    transition: all .3s cubic-bezier(0.32,0.72,0,1); z-index: 200;
    pointer-events: none; white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: #185FA5; }

  .tab-item { transition: color .2s ease; }
  .tab-item svg { transition: all .2s ease; }
  .tab-item.active svg { stroke-width: 2.5; }

  .anim-fade-up { animation: fadeInUp .45s ease-out both; }
  .chip { transition: all .2s ease; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .photo-thumb { position: relative; border-radius: 12px; overflow: hidden; }
  .photo-placeholder {
    background: linear-gradient(135deg, #334155 0%, #0F172A 100%);
    position: relative;
  }
  .photo-placeholder::after {
    content: ''; position: absolute; inset: 0; opacity: .18;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 4px);
  }
  .live-dot { animation: livePulse 2s ease-in-out infinite; }
  .sheet { animation: sheetUp .28s cubic-bezier(0.32,0.72,0,1); }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="phone-frame" id="app">
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ═════════ 风险预警详情 ═════════ -->
  <div class="overlay-panel" id="riskDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('riskDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="riskDetailTitle">预警详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="riskDetailBody"></div>
  </div>

  <!-- ═════════ 审批详情 ═════════ -->
  <div class="overlay-panel" id="approvalDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('approvalDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="approvalDetailTitle">审批详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="approvalDetailBody"></div>
  </div>

  <!-- ═════════ 主体详情 ═════════ -->
  <div class="overlay-panel" id="entityDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('entityDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="entityDetailTitle">主体详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="entityDetailBody"></div>
  </div>

  <!-- ═════════ 公告列表 ═════════ -->
  <div class="overlay-panel" id="announceOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">公告</span>
      <button onclick="openAnnounceTemplates()" class="text-[11px] text-slate-500 font-medium px-2 py-1">模板</button>
      <button onclick="openAnnounceComposer()" class="text-[11px] text-blue-600 font-medium px-2 py-1">新建</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3" id="announceBody"></div>
  </div>

  <!-- ═════════ 公告详情 ═════════ -->
  <div class="overlay-panel" id="announceDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">公告详情</span>
      <span id="announceDetailActions" class="flex items-center gap-1"></span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="announceDetailBody"></div>
  </div>

  <!-- ═════════ 公告 新建/编辑 ═════════ -->
  <div class="overlay-panel" id="announceComposerOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceComposerOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="announceComposerTitle">新建公告</span>
      <button onclick="publishAnnounce()" class="text-[12px] font-semibold text-white bg-blue-600 px-3 py-1.5 rounded-lg">发布</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4" id="announceComposerBody"></div>
  </div>

  <!-- ═════════ 公告模板 ═════════ -->
  <div class="overlay-panel" id="announceTplOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceTplOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">公告模板</span>
      <button onclick="openTplForm()" class="text-[11px] text-blue-600 font-medium px-2 py-1">新建</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5" id="announceTplBody"></div>
  </div>

  <!-- ═════════ 公告模板 编辑 ═════════ -->
  <div class="overlay-panel" id="tplFormOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('tplFormOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="tplFormTitle">新建模板</span>
      <button onclick="saveTpl()" class="text-[12px] font-semibold text-white bg-blue-600 px-3 py-1.5 rounded-lg">保存</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4" id="tplFormBody"></div>
  </div>

  <!-- ═════════ 站内信列表 ═════════ -->
  <div class="overlay-panel" id="feedbackOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('feedbackOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">站内信</span>
      <button onclick="openCompose()" class="text-[11px] text-blue-600 font-medium px-2 py-1">发起</button>
    </div>
    <div class="shrink-0 px-4 pb-2 pt-1">
      <select id="feedbackStatusTabs" onchange="setFeedbackStatus(this.value)" class="w-full text-[12px] bg-white border border-slate-200 rounded-lg px-3 py-2 outline-none text-slate-600"></select>
    </div>
    <div class="shrink-0 px-4 pb-2">
      <div class="bg-slate-50 rounded-full px-4 py-2 flex items-center gap-2 border border-slate-100">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
        <input id="feedbackSearch" oninput="setFeedbackKw(this.value)" placeholder="搜索编号 / 主题 / 企业名称"
          class="flex-1 text-sm bg-transparent outline-none placeholder:text-slate-300 text-slate-800" />
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5" id="feedbackBody"></div>
  </div>

  <!-- ═════════ 站内信对话 ═════════ -->
  <div class="overlay-panel" id="threadOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('threadOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1 truncate" id="threadTitle">对话</span>
      <span id="threadStatusBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0"></span>
    </div>
    <div class="shrink-0 px-4 py-2 border-b border-slate-100 bg-white" id="threadMeta"></div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3" id="threadBody"></div>
    <div class="shrink-0 p-3 border-t border-slate-100 bg-white" id="threadFooter"></div>
  </div>

  <!-- ═════════ 站内信 发起 ═════════ -->
  <div class="overlay-panel" id="composeOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('composeOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">发起站内信</span>
      <button onclick="sendCompose()" class="text-[12px] font-semibold text-white bg-blue-600 px-3 py-1.5 rounded-lg">发送</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4" id="composeBody"></div>
  </div>

  <!-- ═════════ 确认 / 输入 弹层 ═════════ -->
  <div id="actionSheet" class="hidden absolute inset-0 z-[80] bg-black/40 flex items-end">
    <div class="w-full bg-white rounded-t-3xl p-5 sheet">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
      <h3 class="text-base font-bold text-slate-900" id="asTitle">确认操作</h3>
      <p class="text-[13px] text-slate-500 mt-1.5 leading-relaxed" id="asDesc"></p>
      <textarea id="asInput" rows="3" class="hidden w-full mt-3 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-400 placeholder:text-slate-300 resize-none"></textarea>
      <div class="flex gap-2 mt-5">
        <button onclick="closeActionSheet()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium active:bg-slate-50">取消</button>
        <button onclick="confirmActionSheet()" id="asConfirm" class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">确认</button>
      </div>
    </div>
  </div>

  <!-- ═════════ 主应用 ═════════ -->
  <div class="flex flex-col flex-1 min-h-0" id="mainApp">
    <!-- Header -->
    <header class="app-header px-4 pt-[max(20px,env(safe-area-inset-top))] pb-3 flex items-center gap-2 shrink-0">
      <div class="flex-1 min-w-0">
        <h1 class="text-xl font-bold text-white tracking-tight truncate" id="headerTitle">风险预警</h1>
        <p class="text-[11px] text-white/60 truncate mt-0.5" id="headerSub">加载中…</p>
      </div>
    </header>

    <!-- Tab content -->
    <div class="flex-1 overflow-y-auto scroll-area" id="tabContent">

      <!-- ===== TAB: 风险预警 ===== -->
      <div id="tab-risk" class="anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-white rounded-2xl p-2 shadow-card border border-slate-100 grid grid-cols-4 gap-1" id="riskStatusTabs"></div>
        </div>
        <div class="px-4 mt-3">
          <div class="bg-white rounded-full px-4 py-2.5 flex items-center gap-2 border border-slate-100 shadow-card">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <input id="riskSearch" oninput="setRiskKw(this.value)" placeholder="搜索预警名称 / 企业名称"
              class="flex-1 text-sm bg-transparent outline-none placeholder:text-slate-300 text-slate-800" />
          </div>
        </div>
        <div class="px-4 mt-2 grid grid-cols-2 gap-2" id="riskFilters"></div>
        <div class="px-4 py-3 space-y-3" id="riskList"></div>
      </div>

      <!-- ===== TAB: 审批记录 ===== -->
      <div id="tab-approval" class="hidden anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-slate-100 rounded-xl p-1 flex" id="apprTabs"></div>
        </div>
        <div class="px-4 mt-3">
          <div class="bg-white rounded-full px-4 py-2.5 flex items-center gap-2 border border-slate-100 shadow-card">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <input id="apprSearch" oninput="setApprKw(this.value)" placeholder="搜索企业名称 / 工单编号"
              class="flex-1 text-sm bg-transparent outline-none placeholder:text-slate-300 text-slate-800" />
          </div>
        </div>
        <div class="px-4 mt-2 grid grid-cols-2 gap-2" id="apprFilters"></div>
        <div class="px-4 py-3 space-y-3" id="apprList"></div>
      </div>

      <!-- ===== TAB: 主体管理 ===== -->
      <div id="tab-entity" class="hidden anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-white rounded-full px-4 py-2.5 flex items-center gap-2 border border-slate-100 shadow-card">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <input id="entSearch" oninput="renderEntity()" placeholder="搜索企业名称 / 信用代码 / 许可证号"
              class="flex-1 text-sm bg-transparent outline-none placeholder:text-slate-300 text-slate-800" />
          </div>
        </div>
        <div class="px-4 mt-2 grid grid-cols-2 gap-2" id="entFilters"></div>
        <div class="px-4 py-3 space-y-2.5" id="entList"></div>
      </div>

      <!-- ===== TAB: 我的 ===== -->
      <div id="tab-my" class="hidden anim-fade-up">
        <div class="px-4 pt-4" id="myProfile"></div>
        <div class="px-4 mt-4">
          <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden" id="myMenu"></div>
        </div>
        <div class="px-4 mt-5 text-center text-[11px] text-slate-300">智慧食安 · 监管端 v1.0</div>
      </div>

    </div>

    <!-- Bottom tab bar -->
    <nav class="app-tabbar shrink-0 px-2 pt-2 pb-[max(14px,env(safe-area-inset-bottom))] flex items-center justify-around" id="bottomTabBar">
      <button onclick="switchTab('risk')" class="tab-item active flex flex-col items-center gap-1 py-1 px-2 text-white" id="tabBtnRisk">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">预警</span>
      </button>
      <button onclick="switchTab('approval')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnApproval">
        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">审批</span>
      </button>
      <button onclick="switchTab('entity')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnEntity">
        <i data-lucide="building-2" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">主体</span>
      </button>
      <button onclick="switchTab('my')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnMy">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">我的</span>
      </button>
    </nav>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  DATA
// ════════════════════════════════════════
const ROLE_TOWN = '城东镇';
const TOWNS = ['城东镇', '南桥镇', '中心镇', '北关镇'];
let userRole = 'R01'; // R01 区级 | R02 镇级
const isDistrict = () => userRole === 'R01';
const inScope = t => isDistrict() || t === ROLE_TOWN;

const MOCK = {
  alarms: [

const SEV_CLS = { '高':'bg-red-50 text-red-600', '中':'bg-amber-50 text-amber-600', '低':'bg-slate-100 text-slate-500' };
const STATUS_CLS = {
  '待审核':'bg-red-50 text-red-600', '待整改':'bg-amber-50 text-amber-600',
  '已确认':'bg-emerald-50 text-emerald-600', '已撤销':'bg-slate-100 text-slate-500',
  '已驳回':'bg-orange-50 text-orange-600', '已通过':'bg-emerald-50 text-emerald-600',
  '沟通中':'bg-amber-50 text-amber-600', '已关闭':'bg-slate-100 text-slate-500',
};
const KIND_CLS = { alarm:'bg-blue-50 text-blue-600', cert:'bg-orange-50 text-orange-600', manual:'bg-indigo-50 text-indigo-600' };
const KIND_LABEL = { alarm:'AI报警记录', cert:'证照到期预警', manual:'人工上报' };
const KIND_ICON = { alarm:'alert-triangle', cert:'file-clock', manual:'clipboard-list' };

const certSeverity = d => d <= 7 ? '高' : d <= 30 ? '中' : '低';
const pad2 = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const nowStamp = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`; };

let currentTab = 'risk';

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

function openOverlay(id) {
  document.getElementById(id).classList.add('open');
  document.getElementById('bottomTabBar').style.display = 'none';
  setTimeout(() => lucide.createIcons(), 80);
}
function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
  if (!document.querySelector('.overlay-panel.open')) {
    document.getElementById('bottomTabBar').style.display = '';
  }
}
function closeAllOverlays() {
  document.querySelectorAll('.overlay-panel.open').forEach(el => el.classList.remove('open'));
  document.getElementById('bottomTabBar').style.display = '';
}

// Action sheet
let actionSheetCb = null;
function openActionSheet({ title, desc = '', withInput = false, placeholder = '', confirmText = '确认', danger = false, onConfirm }) {
  document.getElementById('asTitle').textContent = title;
  const descEl = document.getElementById('asDesc');
  descEl.textContent = desc;
  descEl.style.display = desc ? '' : 'none';
  const input = document.getElementById('asInput');
  input.value = '';
  input.placeholder = placeholder;
  input.classList.toggle('hidden', !withInput);
  const btn = document.getElementById('asConfirm');
  btn.textContent = confirmText;
  btn.className = 'flex-1 py-3 rounded-xl text-white text-sm font-semibold active:scale-[0.99] transition-transform ' + (danger ? 'bg-red-600' : 'bg-blue-600');
  actionSheetCb = onConfirm || null;
  document.getElementById('actionSheet').classList.remove('hidden');
  if (withInput) setTimeout(() => input.focus(), 120);
}
function closeActionSheet() {
  document.getElementById('actionSheet').classList.add('hidden');
  actionSheetCb = null;
}
function confirmActionSheet() {
  const input = document.getElementById('asInput');
  const needsInput = !input.classList.contains('hidden');
  const val = input.value.trim();
  if (needsInput && !val) { showToast('请填写内容'); return; }
  const cb = actionSheetCb;
  closeActionSheet();
  if (cb) cb(val);
}

//  TAB SWITCHING / HEADER
// ════════════════════════════════════════
function switchTab(tab) {
  closeAllOverlays();
  currentTab = tab;
  ['risk','approval','entity','my'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  if (tab === 'risk') renderRisk();
  else if (tab === 'approval') renderApproval();
  else if (tab === 'entity') renderEntity();
  else if (tab === 'my') renderMy();
  updateTabBar();
  updateHeader();
  document.getElementById('tabContent').scrollTop = 0;
  setTimeout(() => lucide.createIcons(), 60);
}

function updateTabBar() {
  const map = { risk:'Risk', approval:'Approval', entity:'Entity', my:'My' };
  Object.keys(map).forEach(k => {
    const btn = document.getElementById('tabBtn' + map[k]);
    const on = k === currentTab;
    btn.classList.toggle('active', on);
    btn.classList.toggle('text-white', on);
    btn.classList.toggle('text-white/55', !on);
    const span = btn.querySelector('span');
    span.classList.toggle('font-semibold', on);
    span.classList.toggle('font-medium', !on);
  });
}

function updateHeader() {
  const title = document.getElementById('headerTitle');
  const sub = document.getElementById('headerSub');
  const scope = isDistrict() ? '区级 · 全区' : '镇级 · ' + ROLE_TOWN;
  if (currentTab === 'risk') {
    const pending = riskRows().filter(r => r.status === '待审核' || r.status === '待整改').length;
    title.textContent = '风险预警';
    sub.textContent = `待处理 ${pending} 条 · ${scope}`;
  } else if (currentTab === 'approval') {
    const n = approvalRows().filter(a => a.status === '待审核').length;
    title.textContent = '审批记录';
    sub.textContent = `待审核 ${n} 条 · ${scope}`;
  } else if (currentTab === 'entity') {
    const n = MOCK.enterprises.filter(e => inScope(e.town)).length;
    title.textContent = '主体管理';
    sub.textContent = `监管主体 ${n} 家 · ${scope}`;
  } else {
    title.textContent = '我的';
    sub.textContent = isDistrict() ? '张主任 · 区级管理员' : '李所长 · 镇级管理员';
  }
}

let riskStatus = '待审核';
let riskKind = 'all';
let riskSev = 'all';
let riskKw = '';

function riskRows() {
  const rows = [];
  MOCK.alarms.forEach(a => rows.push({
    id:a.id, kind:'alarm', kindLabel:'AI报警记录', enterprise:a.enterprise, town:a.town,
    content:a.detectType, severity:a.severity, status:a.status, time:a.time, raw:a,
  }));
  MOCK.certs.forEach(c => rows.push({
    id:c.id, kind:'cert', kindLabel:'证照到期预警', enterprise:c.enterprise, town:c.town,
    content:c.certType + '到期', severity:certSeverity(c.daysLeft), status:c.status, time:c.expiryDate, raw:c,
  }));
  MOCK.manualWarnings.forEach(m => rows.push({
    id:m.id, kind:'manual', kindLabel:'人工上报', enterprise:m.enterprise, town:m.town,
    content:m.detectType, severity:m.severity, status:m.status, time:m.time, raw:m,
  }));
  return rows.filter(r => inScope(r.town));
}
function riskRowsFiltered() {
  const kw = (riskKw || '').trim();
  return riskRows().filter(r => {
    if (riskKind !== 'all' && r.kind !== riskKind) return false;
    if (riskSev !== 'all' && r.severity !== riskSev) return false;
    if (kw && !r.enterprise.includes(kw) && !r.content.includes(kw) && !r.id.includes(kw)) return false;
    return true;
  });
}

function renderRisk() {
  const statuses = ['待审核','待整改','已确认','已撤销'];
  document.getElementById('riskStatusTabs').innerHTML = statuses.map(s => {
    const n = riskRowsFiltered().filter(r => r.status === s).length;
    const on = riskStatus === s;
    return `<button onclick="setRiskStatus('${s}')" class="flex flex-col items-center gap-0.5 py-2 rounded-xl transition-all ${on ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 active:bg-slate-50'}">
      <span class="text-base font-bold tabular-nums leading-none">${n}</span>
      <span class="text-[10px] font-medium ${on ? 'text-white/85' : 'text-slate-400'}">${s}</span>
    </button>`;
  }).join('');

  const selCls = 'w-full text-[12px] bg-white border border-slate-200 rounded-lg px-2 py-2 outline-none text-slate-600';
  const sel = (cur, opts, fn) => `<select onchange="${fn}(this.value)" class="${selCls}">${opts.map(([v,l]) => `<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select>`;
  document.getElementById('riskFilters').innerHTML =
    sel(riskKind, [['all','全部预警'],['alarm','AI报警记录'],['cert','证照到期预警'],['manual','人工上报']], 'setRiskKind')
    + sel(riskSev, [['all','全部紧急程度'],['高','高'],['中','中'],['低','低']], 'setRiskSev');

  const list = riskRowsFiltered().filter(r => r.status === riskStatus);
  const listEl = document.getElementById('riskList');
  if (!list.length) {
    listEl.innerHTML = `<div class="text-center py-16">
      <i data-lucide="inbox" class="w-9 h-9 text-slate-200 mx-auto mb-2"></i>
      <p class="text-xs text-slate-400">当前条件下暂无预警记录</p>
    </div>`;
  } else {
    listEl.innerHTML = list.map(riskCard).join('');
  }
  setTimeout(() => lucide.createIcons(), 40);
}

function riskCard(r) {
  return `<div onclick="openRiskDetail('${r.kind}','${r.id}')" class="bg-white rounded-2xl p-[16px] shadow-card border border-slate-100 active:bg-slate-50 transition-all">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${KIND_CLS[r.kind]}">
        <i data-lucide="${KIND_ICON[r.kind]}" class="w-5 h-5"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md ${KIND_CLS[r.kind]}">${r.kindLabel}</span>
          <span class="text-[11px] text-slate-400">${esc((r.time||'').split(' ')[0])}</span>
        </div>
        <h3 class="text-[15px] font-semibold text-slate-800 leading-snug">${esc(r.content)}</h3>
        <p class="text-[12px] text-slate-400 mt-1 truncate">${esc(r.enterprise)} · ${esc(r.town)}</p>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${SEV_CLS[r.severity]}">${r.severity}</span>
        <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full ${STATUS_CLS[r.status]}">${r.status}</span>
      </div>
    </div>
  </div>`;
}

function setRiskStatus(s) { riskStatus = s; renderRisk(); }
function setRiskKind(k) { riskKind = k; renderRisk(); }
function setRiskSev(v) { riskSev = v; renderRisk(); }
function setRiskKw(v) { riskKw = v; renderRisk(); }

let currentRisk = null;

function findRiskRaw(kind, id) {
  if (kind === 'alarm') return MOCK.alarms.find(a => a.id === id);
  if (kind === 'cert') return MOCK.certs.find(c => c.id === id);
  return MOCK.manualWarnings.find(m => m.id === id);
}

function infoRow(k, v) {
  return `<div class="flex items-start py-2.5 border-b border-slate-50 last:border-0">
    <span class="text-[13px] text-slate-400 w-[86px] shrink-0">${k}</span>
    <span class="text-[13px] text-slate-700 font-medium flex-1 break-all">${esc(v)}</span>
  </div>`;
}

function openRiskDetail(kind, id) {
  currentRisk = { kind, id };
  const raw = findRiskRaw(kind, id);
  if (!raw) return;
  const sev = kind === 'cert' ? certSeverity(raw.daysLeft) : raw.severity;
  const titles = { alarm:'AI报警详情', cert:'证照到期预警', manual:'人工上报预警' };
  document.getElementById('riskDetailTitle').textContent = titles[kind] + ' · ' + id;

  let html = '';
  // 状态条
  html += `<div class="px-4 pt-4 flex items-center gap-2">
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${SEV_CLS[sev]}">${sev}紧急</span>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full ${STATUS_CLS[raw.status]}">${raw.status}</span>
  </div>`;

  // 照片
  if (kind === 'alarm') {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">AI 抓拍截图</h4>
      <div class="photo-thumb photo-placeholder aspect-video flex items-center justify-center">
        <div class="relative z-10 text-center">
          <i data-lucide="camera" class="w-7 h-7 text-white/40 mx-auto mb-1"></i>
          <span class="text-[10px] text-white/50">${esc(raw.cameraLabel||'')}</span>
        </div>
        <span class="absolute top-2 left-2 z-10 text-[10px] text-white/70 bg-black/40 px-1.5 py-0.5 rounded">截图 1</span>
      </div>
    </div>`;
  } else if (kind === 'manual') {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">现场照片</h4>
      <div class="photo-thumb photo-placeholder aspect-video flex items-center justify-center">
        <div class="relative z-10 text-center">
          <i data-lucide="camera" class="w-7 h-7 text-white/40 mx-auto mb-1"></i>
          <span class="text-[10px] text-white/50">${esc((raw.shots && raw.shots[0]) || '现场抓拍')}</span>
        </div>
        <span class="absolute top-2 left-2 z-10 text-[10px] text-white/70 bg-black/40 px-1.5 py-0.5 rounded">● LIVE</span>
      </div>
    </div>`;
  }

  // 预警信息
  html += `<div class="px-4 mt-4">
    <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-1">预警信息</h4>
    <div class="bg-white rounded-2xl px-4 py-1 shadow-card border border-slate-100">`;
  if (kind === 'alarm') {
    html += infoRow('报警编号', raw.id) + infoRow('报警时间', raw.time) + infoRow('企业名称', raw.enterprise)
      + infoRow('所属市场所', raw.town) + infoRow('检测类型', raw.detectType) + infoRow('监控点位', raw.cameraLabel || '—')
      + infoRow('AI置信度', Math.round((raw.confidence||0)*100) + '%') + infoRow('紧急程度', sev) + infoRow('当前状态', raw.status)
      + infoRow('发生次数', '1 次') + infoRow('首次发生', raw.time) + infoRow('最近发生', raw.time)
      + infoRow('关联工单', raw.orderNo || '—');
  } else if (kind === 'cert') {
    html += infoRow('预警编号', raw.id) + infoRow('企业名称', raw.enterprise) + infoRow('所属市场所', raw.town)
      + infoRow('证照类型', raw.certType) + infoRow('证照编号', raw.certNo) + infoRow('到期日期', raw.expiryDate)
      + infoRow('剩余天数', raw.daysLeft + ' 天') + infoRow('紧急程度', sev) + infoRow('当前状态', raw.status);
  } else {
    html += infoRow('预警编号', raw.id) + infoRow('企业名称', raw.enterprise) + infoRow('所属市场所', raw.town)
      + infoRow('监控点位', raw.cameraLabel || '—') + infoRow('检测类型', raw.detectType) + infoRow('紧急程度', sev)
      + infoRow('当前状态', raw.status) + infoRow('报警时间', raw.time) + infoRow('创建人', raw.creator || '—');
  }
  html += `</div></div>`;

  // 问题描述
  if (kind === 'manual' && raw.desc) {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">问题描述</h4>
      <p class="text-[13px] text-slate-600 leading-relaxed bg-white border border-slate-100 rounded-2xl px-4 py-3 shadow-card whitespace-pre-wrap">${esc(raw.desc)}</p>
    </div>`;
  }

  // 处置
  html += `<div class="px-4 mt-5">`;
  if (raw.status === '待审核') {
    const approveText = kind === 'alarm' ? '采纳并下发' : '确认下发';
    html += `<button onclick="askRisk('approve')" class="w-full py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">${approveText}</button>
      <button onclick="askRisk('revoke')" class="w-full py-3 mt-2 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium active:bg-slate-50">撤销预警</button>
      <p class="text-[11px] text-slate-400 text-center mt-3">下发后状态转为「待整改」，商户端可见</p>`;
  } else if (raw.status === '待整改') {
    html += `<div class="bg-amber-50 border border-amber-100 rounded-xl px-4 py-3">
        <p class="text-[12px] text-amber-700 leading-relaxed">已下发至商户整改。整改状态随关联审批工单流转，审批通过后自动归档为「已确认」。</p>
      </div>
      ${raw.orderNo ? `<p class="text-[11px] text-slate-400 text-center mt-3">关联工单：${esc(raw.orderNo)}</p>` : ''}`;
  } else if (raw.status === '已确认') {
    html += `<div class="bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3"><p class="text-[12px] text-emerald-700">关联审批工单已通过，该预警已自动归档。</p></div>`;
  } else {
    html += `<div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-3"><p class="text-[12px] text-slate-500">该预警已撤销，不再下发。</p></div>`;
  }
  html += `</div>`;

  const body = document.getElementById('riskDetailBody');
  body.innerHTML = html;
  body.scrollTop = 0;
  openOverlay('riskDetailOverlay');
}

function askRisk(action) {
  const cfg = {
    approve: { title:'确认下发整改？', desc:'下发后状态转为「待整改」，商户端可见该预警。', confirmText:'确认下发' },
    revoke:  { title:'撤销该预警？', desc:'撤销后商户端将不再看到该预警，且不可恢复。', confirmText:'撤销', danger:true },
  }[action];
  openActionSheet({ ...cfg, onConfirm: () => actRisk(action) });
}

function actRisk(action) {
  const { kind, id } = currentRisk || {};
  const raw = findRiskRaw(kind, id);
  if (!raw) return;
  if (action === 'approve') { raw.status = '待整改'; showToast('已下发整改，状态更新为待整改', 'success'); }
  else if (action === 'revoke') { raw.status = '已撤销'; showToast('预警已撤销'); }
  openRiskDetail(kind, id);
  renderRisk();
  updateHeader();
}

let apprTab = 'pending';   // pending | archived
let apprType = 'all';
let apprSev = 'all';
let apprTown = 'all';
let apprStatus = 'all';

function askApprove() {
  openActionSheet({
    title: '确认通过该工单？', desc: '通过后工单将归档，并同步更新对应预警状态。', confirmText: '确认通过',
    onConfirm: () => doApprove(),
  });
}
// 审批工单关联的预警（来源说明中的 ALM/C/MAN 编号）
function findRiskBySource(a) {
  const m = (a.sourceDesc || '').match(/(ALM\d+|C\d+|MAN\d+)/);
  if (!m) return null;
  const id = m[1];
  const kind = id.startsWith('ALM') ? 'alarm' : id.startsWith('C') ? 'cert' : 'manual';
  return findRiskRaw(kind, id);
}
function doApprove() {
  const { id } = currentAppr || {};
  const idx = MOCK.approvals.findIndex(a => a.id === id);
  if (idx < 0) return;
  const a = MOCK.approvals[idx];
  const linked = findRiskBySource(a);
  MOCK.approvals.splice(idx, 1);
  MOCK.archivedApprovals.unshift({
    ...a, status:'已通过', result:'通过', completeTime: nowStamp(),
    reviewer: isDistrict() ? '张主任' : '李所长', reviewTime: nowStamp(),
    reviewOpinion: '经审核，材料齐全、整改到位，予以通过。',
  });
  if (linked && linked.status !== '已撤销') linked.status = '已确认';
  closeOverlay('approvalDetailOverlay');
  renderApproval();
  renderRisk();
  updateHeader();
  showToast(linked ? '工单已通过，关联预警已自动归档' : '工单已通过并归档', 'success');
}
function askReject() {
  openActionSheet({
    title: '驳回原因', desc: '请填写驳回原因，商户将收到该说明。', withInput: true,
    placeholder: '如：提供的证明材料不完整，请补充…', confirmText: '确认驳回', danger: true,
    onConfirm: reason => doReject(reason),
  });
}
function doReject(reason) {
  const { id } = currentAppr || {};
  const a = MOCK.approvals.find(x => x.id === id);
  if (!a) return;
  a.status = '已驳回';
  a.rejectHistory = a.rejectHistory || [];
  a.rejectHistory.push({
    rejectTime: nowStamp(), reviewer: isDistrict() ? '张主任' : '李所长',
    reason, rejectRound: a.rejectHistory.length + 1,
  });
  openApprovalDetail(id, false);
  renderApproval();
  updateHeader();
  showToast('已驳回，商户将收到通知');
}

let entTown = 'all';
let entBizType = 'all';
let entBizMode = 'all';
let entDept = 'all';
let entBizStatus = 'all';
let entBind = 'all';

function renderEntity() {
  const townOpts = [['all','全部乡镇']].concat(TOWNS.filter(t => isDistrict() || t === ROLE_TOWN).map(t => [t, t]));

  const selCls = 'w-full text-[12px] bg-white border border-slate-200 rounded-lg px-2 py-2 outline-none text-slate-600';
  const sel = (cur, opts, fn) => `<select onchange="${fn}(this.value)" class="${selCls}">${opts.map(([v,l]) => `<option value="${v}" ${cur===v?'selected':''}>${l}</option>`).join('')}</select>`;
  document.getElementById('entFilters').innerHTML =
    sel(entTown, townOpts, 'setEntTown')
    + sel(entBizType, [['all','主体业态'],['餐饮服务','餐饮服务'],['食品销售','食品销售'],['食品生产','食品生产'],['单位食堂','单位食堂'],['其他','其他']], 'setEntBizType')
    + sel(entBizMode, [['all','经营方式'],['堂食','堂食'],['外卖','外卖'],['现场制售','现场制售'],['批发零售','批发零售'],['生产加工','生产加工'],['零售','零售']], 'setEntBizMode')
    + sel(entDept, [['all','所属科室'],['餐饮','餐饮'],['流通','流通'],['生产','生产'],['电动车','电动车']], 'setEntDept')
    + sel(entBizStatus, [['all','营业状态'],['营业','营业'],['停业','停业'],['注销','注销']], 'setEntBizStatus')
    + sel(entBind, [['all','绑定关系'],['bound','已绑定'],['unbound','未绑定'],['blocked','限制解绑']], 'setEntBind');

  const kw = (document.getElementById('entSearch').value || '').trim();
  const rows = MOCK.enterprises.filter(e => {
    if (!inScope(e.town)) return false;
    if (entTown !== 'all' && e.town !== entTown) return false;
    if (entBizType !== 'all' && e.entityType !== entBizType) return false;
    if (entBizMode !== 'all' && e.bizMode !== entBizMode) return false;
    if (entDept !== 'all' && e.department !== entDept) return false;
    if (entBizStatus !== 'all' && e.bizStatus !== entBizStatus) return false;
    if (entBind === 'bound' && !e.bindPhone) return false;
    if (entBind === 'unbound' && e.bindPhone) return false;
    if (entBind === 'blocked' && !e.unbindBlocked) return false;
    if (kw && !e.name.includes(kw) && !e.creditCode.includes(kw) && !(e.licenseNo||'').includes(kw)) return false;
    return true;
  });

  const listEl = document.getElementById('entList');
  if (!rows.length) {
    listEl.innerHTML = `<div class="text-center py-16">

function announceRows() {
  return MOCK.announcements.filter(a => {
    if (isDistrict()) return true;
    if (a.scope === '全区') return true;
    if (a.scope === ROLE_TOWN) return true;
    return (a.scopeTowns || []).includes(ROLE_TOWN);
  });
}
function scopeDisplay(a) {
  if (a.scope === '全区') return '全区';
  if (a.scope === '自定义镇') return `${(a.scopeTowns||[]).join('、')}（${(a.scopeTowns||[]).length}个镇）`;
  return a.scope;
}
function scopeColor(a) {
  if (a.scope === '全区') return 'bg-blue-50 text-blue-600';
  if (a.scope === '自定义镇') return 'bg-orange-50 text-orange-600';
  return 'bg-emerald-50 text-emerald-600';
}
function repeatLabel(a) {
  const map = { none:'不重复', daily:'每天', weekly:'每周', monthly:'每月' };
  return map[a.repeatType] || '不重复';
}
function announceSourceLabel() { return isDistrict() ? '区市场监督管理局' : `${ROLE_TOWN}市场监管所`; }

function renderAnnScope() {

function toggleAnnTown(t) {

function renderAnnRepeat() {

function applyTpl(id) {

}
function publishAnnounce() {
  const f = announceForm;
  if (!f.title.trim()) { showToast('请填写公告标题'); return; }
  if (!f.content.trim()) { showToast('请填写详细内容'); return; }
  if (f.scope === '自定义镇' && f.scopeTowns.length === 0) { showToast('请至少选择一个镇'); return; }
  const payload = {
    title: f.title.trim(),
    scope: f.scope,
    scopeTowns: f.scope === '自定义镇' ? f.scopeTowns.slice() : (f.scope === '全区' ? [] : [f.scope]),
    content: f.content.trim(),
    repeatType: f.repeatType,
    sendTarget: f.sendTarget,
  };
  if (announceEditId) {
    const a = MOCK.announcements.find(x => x.id === announceEditId);
    if (a) Object.assign(a, payload);
    showToast('公告已更新', 'success');
  } else {
    MOCK.announcements.unshift({
      id: 'ANC' + String(MOCK.announcements.length + 1).padStart(3, '0'),
      ...payload,
      source: announceSourceLabel(),
      createTime: nowStamp(),
      status: '已发布',

}

let feedbackStatus = 'all';
let feedbackKw = '';
function feedbackRows() {
  const kw = (feedbackKw || '').trim();
  return MOCK.feedbacks.filter(f => {
    if (!inScope(f.town)) return false;
    if (feedbackStatus !== 'all' && f.status !== feedbackStatus) return false;
    if (kw && !(f.no || '').includes(kw) && !(f.subject || '').includes(kw) && !f.enterprise.includes(kw)) return false;
    return true;
  });

function getBindPhone(f) {

}

}

let currentThread = null;
let replyAttachments = [];
function openThread(id) {
  const f = MOCK.feedbacks.find(x => x.id === id);

}
function renderThread() {
  const f = currentThread;
  if (!f) return;
  const isClosed = f.status === '已关闭';
  const badge = document.getElementById('threadStatusBadge');
  badge.textContent = f.status;
  badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0 ' + (STATUS_CLS[f.status] || 'bg-slate-100 text-slate-500');
  document.getElementById('threadMeta').innerHTML = `<div class="space-y-1 text-[11px] text-slate-400">
    <div class="flex items-center gap-1.5"><span class="shrink-0">会话编号</span><span class="text-slate-600 font-mono font-medium">${esc(f.no || '—')}</span></div>
    <div>主题：<span class="text-slate-600 font-medium">${esc(f.subject || '—')}</span></div>
    <div>企业名称：${esc(f.enterprise)} · 所属乡镇：${esc(f.town)}</div>
    <div>联系人：${esc(f.contact || '')} · ${esc(getBindPhone(f))}</div>
  </div>`;
  // 站内信内容作为沟通记录第一条
  const firstMsg = { content: f.content, time: f.createTime, isAdmin: !!f.initiatedByAdmin };
  const allMessages = [firstMsg, ...(f.initiatedByAdmin ? (f.messages || []).slice(1) : (f.messages || []))];
  document.getElementById('threadBody').innerHTML = allMessages.map(m => {
    const atts = (m.attachments || []).map(a => `<span class="inline-flex items-center gap-1 bg-white/60 border border-slate-200 rounded px-1.5 py-0.5 text-[10px] text-blue-600 mt-1.5">📎 ${esc(a)}</span>`).join('');
    return `<div class="flex flex-col ${m.isAdmin ? 'items-end' : 'items-start'}">
      <div class="max-w-[80%] px-3.5 py-2.5 rounded-2xl text-[13px] leading-relaxed ${m.isAdmin ? 'bg-blue-600 text-white rounded-br-md' : 'bg-white border border-slate-100 text-slate-700 rounded-bl-md'}">
        <div class="text-[10px] mb-0.5 ${m.isAdmin ? 'text-white/70' : 'text-slate-400'}">${m.isAdmin ? '管理员' : esc(f.contact || '商户')} · ${esc(m.time)}</div>
        <div>${esc(m.content)}</div>
        ${atts}
      </div>
    </div>`;
  }).join('');
  // footer
  const footer = document.getElementById('threadFooter');
  if (isClosed) {
    footer.innerHTML = `<div class="text-center text-[11px] text-slate-400 bg-slate-50 rounded-xl py-3">该反馈已关闭，无法继续回复</div>`;
  } else {
    const attChips = replyAttachments.map((a, i) => `<span class="inline-flex items-center gap-1 text-[10px] bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-slate-500">📎 ${esc(a)}<button onclick="removeReplyAtt(${i})" class="text-slate-300 hover:text-red-500">×</button></span>`).join('');
    footer.innerHTML = `
      ${replyAttachments.length ? `<div class="flex flex-wrap gap-1.5 mb-2">${attChips}</div>` : ''}
      <div class="flex items-end gap-2">
        <button onclick="addReplyAtt()" class="shrink-0 w-9 h-9 rounded-xl border border-slate-200 flex items-center justify-center text-slate-400 active:bg-slate-50"><i data-lucide="paperclip" class="w-4 h-4"></i></button>
        <textarea id="threadInput" rows="1" placeholder="输入回复内容…" class="flex-1 resize-none text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-400 placeholder:text-slate-300"></textarea>
        <button onclick="sendReply()" class="shrink-0 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-95 transition-transform">发送</button>
      </div>
      <button onclick="closeFeedback()" class="w-full mt-2 py-2 rounded-xl border border-slate-200 text-[12px] text-slate-500 active:bg-slate-50">关闭反馈</button>`;
  }
  setTimeout(() => lucide.createIcons(), 30);
  const body = document.getElementById('threadBody');
  body.scrollTop = body.scrollHeight;
}
function addReplyAtt() {
  openActionSheet({
    title: '添加附件', desc: '请输入附件名称（原型演示，可自定义）。', withInput: true, placeholder: '例如：整改照片.jpg', confirmText: '添加',
    onConfirm: (val) => { replyAttachments.push(val); renderThread(); }
  });
}
function removeReplyAtt(i) { replyAttachments.splice(i, 1); renderThread(); }
function sendReply() {
  const input = document.getElementById('threadInput');
  const val = (input.value || '').trim();
  if (!val && replyAttachments.length === 0) { showToast('请输入回复内容'); return; }
  const f = currentThread;
  if (!f) return;
  f.messages = f.messages || [];
  f.messages.push({ id: 'M' + Date.now(), sender: 'admin', content: val, attachments: replyAttachments.slice(), time: nowStamp(), isAdmin: true });
  f.status = '沟通中';
  replyAttachments = [];
  renderThread();
  renderFeedbackList();
  showToast('回复已发送', 'success');
}
function closeFeedback() {
  openActionSheet({
    title: '关闭反馈', desc: '关闭后该站内信将无法继续回复，确认关闭吗？', confirmText: '关闭', danger: true,
    onConfirm: () => {
      if (currentThread) currentThread.status = '已关闭';
      renderThread();
      renderFeedbackList();
      showToast('反馈已关闭', 'success');
    }
  });
}

    <div>
      <label class="block text-[12px] font-semibold text-slate-600 mb-1.5">附件</label>
      ${composeAttachments.length ? `<div class="flex flex-wrap gap-1.5 mb-2">${attChips}</div>` : ''}
      <button onclick="addComposeAtt()" class="inline-flex items-center gap-1.5 text-[12px] text-blue-600 border border-dashed border-slate-300 rounded-lg px-3 py-2 active:bg-slate-50"><i data-lucide="paperclip" class="w-4 h-4"></i>添加附件</button>
    </div>`;
  setTimeout(() => lucide.createIcons(), 30);
}
function addComposeAtt() {
  openActionSheet({
    title: '添加附件', desc: '请输入附件名称（原型演示，可自定义）。', withInput: true, placeholder: '例如：通知文件.pdf', confirmText: '添加',
    onConfirm: (val) => { composeAttachments.push(val); renderCompose(); }
  });
}
function removeComposeAtt(i) { composeAttachments.splice(i, 1); renderCompose(); }
function sendCompose() {
  if (!composeSubject.trim()) { showToast('请输入站内信主题'); return; }
  if (!composeContent.trim() && composeAttachments.length === 0) { showToast('请输入站内信内容'); return; }
  const stamp = Date.now().toString().slice(-8);
  const make = (ent, idx) => ({
    id: 'FB' + stamp + idx,
    no: 'ZNX' + nowStamp().replace(/[-: ]/g, '').slice(0, 8) + String(idx + 1).padStart(3, '0'),
    enterprise: ent.name,
    town: ent.town,
    type: '系统通知',
    subject: composeSubject.trim(),
    content: composeContent.trim(),
    contact: ent.legalPerson || '',
    phone: ent.bindPhone || '',
    status: '沟通中',
    createTime: nowStamp(),
    initiatedByAdmin: true,
    messages: [{ id: 'M' + stamp + idx, sender: 'admin', content: composeContent.trim(), attachments: composeAttachments.slice(), time: nowStamp(), isAdmin: true }],
  });
  let targets = [];
  if (composeTarget === 'one') {
    const ent = MOCK.enterprises.find(e => e.id === composeMerchant);
    if (!ent) { showToast('请选择发送对象'); return; }
    targets = [ent];
  } else {
    if (!composeTowns.length) { showToast('请选择分组'); return; }
    targets = MOCK.enterprises.filter(e => composeTowns.includes(e.town) && inScope(e.town));
    if (!targets.length) { showToast('所选分组暂无主体'); return; }
  }
  MOCK.feedbacks.unshift(...targets.map(make));
  closeOverlay('composeOverlay');
  renderFeedbackList();
  renderMy();
  showToast(targets.length > 1 ? `已向 ${targets.length} 个主体发送站内信` : '站内信已发送', 'success');
}

// ════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('actionSheet').classList.contains('hidden')) { closeActionSheet(); return; }
    const open = document.querySelector('.overlay-panel.open');
    if (open) closeOverlay(open.id);
  }
});

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
switchTab('risk');
lucide.createIcons();
</script>
