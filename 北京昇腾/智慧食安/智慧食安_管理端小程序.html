<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>智慧食安 · 监管端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"DM Sans"', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
        },
        colors: {
          slate: {
            50: '#F8FAFC', 100: '#F1F5F9', 200: '#E2E8F0', 300: '#CBD5E1',
            400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155',
            800: '#1E293B', 900: '#0F172A',
          },
          blue: {
            50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 300: '#93C5FD',
            400: '#60A5FA', 500: '#3B82F6', 600: '#1A56DB', 700: '#1E40AF',
            800: '#1E3A8A', 900: '#1A295C',
          },
        },
      },
    },
  }
</script>
<style>
  :root {
    --accent: #1A56DB;
    --navy: #1E3A8A;
    --border: #E2E8F0;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-elevated: 0 4px 16px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body {
    font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    background: #CBD5E1;
    display: flex; justify-content: center; align-items: center;
    height: 100dvh; margin: 0;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .phone-frame {
    width: 100%; max-width: 430px; height: 100dvh; max-height: 932px;
    background: #F8FAFC; overflow: hidden; position: relative;
    display: flex; flex-direction: column; isolation: isolate;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 20px 60px rgba(0,0,0,0.15);
  }
  @media (min-width: 431px) {
    .phone-frame { border-radius: 28px; height: min(100dvh - 40px, 880px); }
  }
  .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  *::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.8); } }
  @keyframes livePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.45); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }

  .app-header { background: linear-gradient(135deg, #1E3A8A 0%, #1A56DB 100%); }
  .app-tabbar { background: #1E3A8A; }

  .overlay-panel {
    position: absolute; inset: 0; background: #F8FAFC; z-index: 50;
    transform: translateY(100%); transition: transform .35s cubic-bezier(0.32,0.72,0,1);
    display: flex; flex-direction: column;
  }
  .overlay-panel.open { transform: translateY(0); }

  .toast {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: #1E293B; color: #fff; padding: 12px 22px; border-radius: 24px;
    font-size: 13px; font-weight: 500; opacity: 0;
    transition: all .3s cubic-bezier(0.32,0.72,0,1); z-index: 200;
    pointer-events: none; white-space: nowrap; max-width: 88%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: #1A56DB; }

  .tab-item { transition: color .2s ease; }
  .tab-item svg { transition: all .2s ease; }
  .tab-item.active svg { stroke-width: 2.5; }

  .anim-fade-up { animation: fadeInUp .45s ease-out both; }
  .chip { transition: all .2s ease; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .photo-thumb { position: relative; border-radius: 12px; overflow: hidden; }
  .photo-placeholder {
    background: linear-gradient(135deg, #334155 0%, #0F172A 100%);
    position: relative;
  }
  .photo-placeholder::after {
    content: ''; position: absolute; inset: 0; opacity: .18;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 4px);
  }
  .live-dot { animation: livePulse 2s ease-in-out infinite; }
  .sheet { animation: sheetUp .28s cubic-bezier(0.32,0.72,0,1); }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="phone-frame" id="app">
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ═════════ 风险预警详情 ═════════ -->
  <div class="overlay-panel" id="riskDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('riskDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="riskDetailTitle">预警详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="riskDetailBody"></div>
  </div>

  <!-- ═════════ 审批详情 ═════════ -->
  <div class="overlay-panel" id="approvalDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('approvalDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="approvalDetailTitle">审批详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="approvalDetailBody"></div>
  </div>

  <!-- ═════════ 主体详情 ═════════ -->
  <div class="overlay-panel" id="entityDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('entityDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1" id="entityDetailTitle">主体详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="entityDetailBody"></div>
  </div>

  <!-- ═════════ 通知信息 ═════════ -->
  <div class="overlay-panel" id="notifOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('notifOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">通知信息</span>
      <button onclick="markAllRead()" class="text-[11px] text-blue-600 font-medium px-2 py-1">全部已读</button>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5" id="notifBody"></div>
  </div>

  <!-- ═════════ 公告列表 ═════════ -->
  <div class="overlay-panel" id="announceOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">公告</span>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3" id="announceBody"></div>
  </div>

  <!-- ═════════ 公告详情 ═════════ -->
  <div class="overlay-panel" id="announceDetailOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('announceDetailOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">公告详情</span>
    </div>
    <div class="flex-1 overflow-y-auto pb-6" id="announceDetailBody"></div>
  </div>

  <!-- ═════════ 站内信列表 ═════════ -->
  <div class="overlay-panel" id="feedbackOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('feedbackOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1">站内信</span>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2.5" id="feedbackBody"></div>
  </div>

  <!-- ═════════ 站内信对话 ═════════ -->
  <div class="overlay-panel" id="threadOverlay">
    <div class="flex items-center gap-2 px-4 py-4 border-b border-slate-200 bg-white shrink-0">
      <button onclick="closeOverlay('threadOverlay')" class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100">
        <i data-lucide="arrow-left" class="w-5 h-5 text-slate-700"></i>
      </button>
      <span class="text-base font-semibold text-slate-900 flex-1 truncate" id="threadTitle">对话</span>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3" id="threadBody"></div>
    <div class="shrink-0 p-3 border-t border-slate-100 bg-white flex items-end gap-2">
      <textarea id="threadInput" rows="1" placeholder="输入回复内容…" class="flex-1 resize-none text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-400 placeholder:text-slate-300"></textarea>
      <button onclick="sendReply()" class="shrink-0 px-4 py-2.5 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-95 transition-transform">发送</button>
    </div>
  </div>

  <!-- ═════════ 确认 / 输入 弹层 ═════════ -->
  <div id="actionSheet" class="hidden absolute inset-0 z-[80] bg-black/40 flex items-end">
    <div class="w-full bg-white rounded-t-3xl p-5 sheet">
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4"></div>
      <h3 class="text-base font-bold text-slate-900" id="asTitle">确认操作</h3>
      <p class="text-[13px] text-slate-500 mt-1.5 leading-relaxed" id="asDesc"></p>
      <textarea id="asInput" rows="3" class="hidden w-full mt-3 text-sm bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 outline-none focus:border-blue-400 placeholder:text-slate-300 resize-none"></textarea>
      <div class="flex gap-2 mt-5">
        <button onclick="closeActionSheet()" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium active:bg-slate-50">取消</button>
        <button onclick="confirmActionSheet()" id="asConfirm" class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">确认</button>
      </div>
    </div>
  </div>

  <!-- ═════════ 主应用 ═════════ -->
  <div class="flex flex-col flex-1 min-h-0" id="mainApp">
    <!-- Header -->
    <header class="app-header px-4 pt-[max(20px,env(safe-area-inset-top))] pb-3 flex items-center gap-2 shrink-0">
      <div class="flex-1 min-w-0">
        <h1 class="text-xl font-bold text-white tracking-tight truncate" id="headerTitle">风险预警</h1>
        <p class="text-[11px] text-white/60 truncate mt-0.5" id="headerSub">加载中…</p>
      </div>
      <button onclick="openNotif()" class="relative w-9 h-9 rounded-full bg-white/15 flex items-center justify-center active:bg-white/25 transition-colors shrink-0">
        <i data-lucide="bell" class="w-[18px] h-[18px] text-white"></i>
        <span id="bellBadge" class="hidden absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] font-bold items-center justify-center flex">0</span>
      </button>
    </header>

    <!-- Tab content -->
    <div class="flex-1 overflow-y-auto scroll-area" id="tabContent">

      <!-- ===== TAB: 风险预警 ===== -->
      <div id="tab-risk" class="anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-white rounded-2xl p-2 shadow-card border border-slate-100 grid grid-cols-4 gap-1" id="riskStatusTabs"></div>
        </div>
        <div class="px-4 mt-3">
          <div class="flex gap-2 overflow-x-auto pb-1" id="riskKindChips"></div>
        </div>
        <div class="px-4 py-3 space-y-3" id="riskList"></div>
      </div>

      <!-- ===== TAB: 审批记录 ===== -->
      <div id="tab-approval" class="hidden anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-slate-100 rounded-xl p-1 flex" id="apprTabs"></div>
        </div>
        <div class="px-4 mt-3">
          <div class="flex gap-2 overflow-x-auto pb-1" id="apprTypeChips"></div>
        </div>
        <div class="px-4 py-3 space-y-3" id="apprList"></div>
      </div>

      <!-- ===== TAB: 主体管理 ===== -->
      <div id="tab-entity" class="hidden anim-fade-up">
        <div class="px-4 pt-3">
          <div class="bg-white rounded-full px-4 py-2.5 flex items-center gap-2 border border-slate-100 shadow-card">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 shrink-0"></i>
            <input id="entSearch" oninput="renderEntity()" placeholder="搜索企业名称 / 信用代码 / 许可证号"
              class="flex-1 text-sm bg-transparent outline-none placeholder:text-slate-300 text-slate-800" />
          </div>
        </div>
        <div class="px-4 mt-3">
          <div class="flex gap-2 overflow-x-auto pb-1" id="entTownChips"></div>
        </div>
        <div class="px-4 py-3 space-y-2.5" id="entList"></div>
      </div>

      <!-- ===== TAB: 我的 ===== -->
      <div id="tab-my" class="hidden anim-fade-up">
        <div class="px-4 pt-4" id="myProfile"></div>
        <div class="px-4 mt-4">
          <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden" id="myMenu"></div>
        </div>
        <div class="px-4 mt-5 text-center text-[11px] text-slate-300">智慧食安 · 监管端 v1.0</div>
      </div>

    </div>

    <!-- Bottom tab bar -->
    <nav class="app-tabbar shrink-0 px-2 pt-2 pb-[max(14px,env(safe-area-inset-bottom))] flex items-center justify-around" id="bottomTabBar">
      <button onclick="switchTab('risk')" class="tab-item active flex flex-col items-center gap-1 py-1 px-2 text-white" id="tabBtnRisk">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
        <span class="text-[10px] font-semibold">预警</span>
      </button>
      <button onclick="switchTab('approval')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnApproval">
        <i data-lucide="clipboard-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">审批</span>
      </button>
      <button onclick="switchTab('entity')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnEntity">
        <i data-lucide="building-2" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">主体</span>
      </button>
      <button onclick="switchTab('my')" class="tab-item flex flex-col items-center gap-1 py-1 px-2 text-white/55" id="tabBtnMy">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">我的</span>
      </button>
    </nav>
  </div>
</div>

<script>

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type + ' show';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2000);
}

function openOverlay(id) {
  document.getElementById(id).classList.add('open');
  document.getElementById('bottomTabBar').style.display = 'none';
  setTimeout(() => lucide.createIcons(), 80);
}
function closeOverlay(id) {
  document.getElementById(id).classList.remove('open');
  if (!document.querySelector('.overlay-panel.open')) {
    document.getElementById('bottomTabBar').style.display = '';
  }
}
function closeAllOverlays() {
  document.querySelectorAll('.overlay-panel.open').forEach(el => el.classList.remove('open'));
  document.getElementById('bottomTabBar').style.display = '';
}

// Action sheet
let actionSheetCb = null;
function openActionSheet({ title, desc = '', withInput = false, placeholder = '', confirmText = '确认', danger = false, onConfirm }) {
  document.getElementById('asTitle').textContent = title;
  const descEl = document.getElementById('asDesc');
  descEl.textContent = desc;
  descEl.style.display = desc ? '' : 'none';
  const input = document.getElementById('asInput');
  input.value = '';
  input.placeholder = placeholder;
  input.classList.toggle('hidden', !withInput);
  const btn = document.getElementById('asConfirm');
  btn.textContent = confirmText;
  btn.className = 'flex-1 py-3 rounded-xl text-white text-sm font-semibold active:scale-[0.99] transition-transform ' + (danger ? 'bg-red-600' : 'bg-blue-600');
  actionSheetCb = onConfirm || null;
  document.getElementById('actionSheet').classList.remove('hidden');
  if (withInput) setTimeout(() => input.focus(), 120);
}
function closeActionSheet() {
  document.getElementById('actionSheet').classList.add('hidden');
  actionSheetCb = null;
}
function confirmActionSheet() {
  const input = document.getElementById('asInput');
  const needsInput = !input.classList.contains('hidden');
  const val = input.value.trim();
  if (needsInput && !val) { showToast('请填写内容'); return; }
  const cb = actionSheetCb;
  closeActionSheet();
  if (cb) cb(val);
}

function switchTab(tab) {
  closeAllOverlays();
  currentTab = tab;
  ['risk','approval','entity','my'].forEach(t => document.getElementById('tab-' + t).classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  if (tab === 'risk') renderRisk();
  else if (tab === 'approval') renderApproval();
  else if (tab === 'entity') renderEntity();
  else if (tab === 'my') renderMy();
  updateTabBar();
  updateHeader();
  document.getElementById('tabContent').scrollTop = 0;
  setTimeout(() => lucide.createIcons(), 60);
}

function updateTabBar() {
  const map = { risk:'Risk', approval:'Approval', entity:'Entity', my:'My' };
  Object.keys(map).forEach(k => {
    const btn = document.getElementById('tabBtn' + map[k]);
    const on = k === currentTab;
    btn.classList.toggle('active', on);
    btn.classList.toggle('text-white', on);
    btn.classList.toggle('text-white/55', !on);
    const span = btn.querySelector('span');
    span.classList.toggle('font-semibold', on);
    span.classList.toggle('font-medium', !on);
  });
}

function updateHeader() {
  const title = document.getElementById('headerTitle');
  const sub = document.getElementById('headerSub');
  const scope = isDistrict() ? '区级 · 全区' : '镇级 · ' + ROLE_TOWN;
  if (currentTab === 'risk') {
    const pending = riskRows().filter(r => r.status === '待审核' || r.status === '待整改').length;
    title.textContent = '风险预警';
    sub.textContent = `待处理 ${pending} 条 · ${scope}`;
  } else if (currentTab === 'approval') {
    const n = approvalRows().filter(a => a.status === '待审批').length;
    title.textContent = '审批记录';
    sub.textContent = `待审批 ${n} 条 · ${scope}`;
  } else if (currentTab === 'entity') {
    const n = MOCK.enterprises.filter(e => inScope(e.town)).length;
    title.textContent = '主体管理';
    sub.textContent = `监管主体 ${n} 家 · ${scope}`;
  } else {
    title.textContent = '我的';
    sub.textContent = isDistrict() ? '张主任 · 区级管理员' : '李所长 · 镇级管理员';
  }
  const unread = MOCK.notifications.filter(n => !n.read).length;
  const badge = document.getElementById('bellBadge');
  if (unread) { badge.textContent = unread > 99 ? '99+' : unread; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

let riskStatus = '待审核';
let riskKind = 'all';

function riskRows() {
  const rows = [];
  MOCK.alarms.forEach(a => rows.push({
    id:a.id, kind:'alarm', kindLabel:'AI报警', enterprise:a.enterprise, town:a.town,
    content:a.detectType, severity:a.severity, status:a.status, time:a.time, raw:a,
  }));
  MOCK.certs.forEach(c => rows.push({
    id:c.id, kind:'cert', kindLabel:'证照到期', enterprise:c.enterprise, town:c.town,
    content:c.certType + '到期', severity:certSeverity(c.daysLeft), status:c.status, time:c.expiryDate, raw:c,
  }));
  MOCK.manualWarnings.forEach(m => rows.push({
    id:m.id, kind:'manual', kindLabel:'人工上报', enterprise:m.enterprise, town:m.town,
    content:m.detectType, severity:m.severity, status:m.status, time:m.time, raw:m,
  }));
  return rows.filter(r => inScope(r.town));
}
function riskRowsFiltered() {
  return riskRows().filter(r => riskKind === 'all' || r.kind === riskKind);
}

function renderRisk() {
  const statuses = ['待审核','待整改','已确认','已撤销'];
  document.getElementById('riskStatusTabs').innerHTML = statuses.map(s => {
    const n = riskRowsFiltered().filter(r => r.status === s).length;
    const on = riskStatus === s;
    return `<button onclick="setRiskStatus('${s}')" class="flex flex-col items-center gap-0.5 py-2 rounded-xl transition-all ${on ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-500 active:bg-slate-50'}">
      <span class="text-base font-bold tabular-nums leading-none">${n}</span>
      <span class="text-[10px] font-medium ${on ? 'text-white/85' : 'text-slate-400'}">${s}</span>
    </button>`;
  }).join('');

  const kinds = [['all','全部预警'],['alarm','AI报警'],['cert','证照到期'],['manual','人工上报']];
  document.getElementById('riskKindChips').innerHTML = kinds.map(([v,l]) => {
    const on = riskKind === v;
    return `<button onclick="setRiskKind('${v}')" class="chip shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium border transition-all ${on ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200'}">${l}</button>`;
  }).join('');

  const list = riskRowsFiltered().filter(r => r.status === riskStatus);
  const listEl = document.getElementById('riskList');
  if (!list.length) {
    listEl.innerHTML = `<div class="text-center py-16">
      <i data-lucide="inbox" class="w-9 h-9 text-slate-200 mx-auto mb-2"></i>
      <p class="text-xs text-slate-400">当前条件下暂无预警记录</p>
    </div>`;
  } else {
    listEl.innerHTML = list.map(riskCard).join('');
  }
  setTimeout(() => lucide.createIcons(), 40);
}

function riskCard(r) {
  return `<div onclick="openRiskDetail('${r.kind}','${r.id}')" class="bg-white rounded-2xl p-[16px] shadow-card border border-slate-100 active:bg-slate-50 transition-all">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${KIND_CLS[r.kind]}">
        <i data-lucide="${KIND_ICON[r.kind]}" class="w-5 h-5"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md ${KIND_CLS[r.kind]}">${r.kindLabel}</span>
          <span class="text-[11px] text-slate-400">${esc((r.time||'').split(' ')[0])}</span>
        </div>
        <h3 class="text-[15px] font-semibold text-slate-800 leading-snug">${esc(r.content)}</h3>
        <p class="text-[12px] text-slate-400 mt-1 truncate">${esc(r.enterprise)} · ${esc(r.town)}</p>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${SEV_CLS[r.severity]}">${r.severity}</span>
        <span class="text-[11px] font-medium px-2.5 py-0.5 rounded-full ${STATUS_CLS[r.status]}">${r.status}</span>
      </div>
    </div>
  </div>`;
}

function setRiskStatus(s) { riskStatus = s; renderRisk(); }
function setRiskKind(k) { riskKind = k; renderRisk(); }

let currentRisk = null;

function findRiskRaw(kind, id) {
  if (kind === 'alarm') return MOCK.alarms.find(a => a.id === id);
  if (kind === 'cert') return MOCK.certs.find(c => c.id === id);
  return MOCK.manualWarnings.find(m => m.id === id);
}

function infoRow(k, v) {
  return `<div class="flex items-start py-2.5 border-b border-slate-50 last:border-0">
    <span class="text-[13px] text-slate-400 w-[86px] shrink-0">${k}</span>
    <span class="text-[13px] text-slate-700 font-medium flex-1 break-all">${esc(v)}</span>
  </div>`;
}

function openRiskDetail(kind, id) {
  currentRisk = { kind, id };
  const raw = findRiskRaw(kind, id);
  if (!raw) return;
  const sev = kind === 'cert' ? certSeverity(raw.daysLeft) : raw.severity;
  const titles = { alarm:'AI报警详情', cert:'证照到期预警', manual:'人工上报预警' };
  document.getElementById('riskDetailTitle').textContent = titles[kind] + ' · ' + id;

  let html = '';
  // 状态条
  html += `<div class="px-4 pt-4 flex items-center gap-2">
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${SEV_CLS[sev]}">${sev}紧急</span>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full ${STATUS_CLS[raw.status]}">${raw.status}</span>
  </div>`;

  // 照片
  if (kind === 'alarm') {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">AI 抓拍截图</h4>
      <div class="photo-thumb photo-placeholder aspect-video flex items-center justify-center">
        <div class="relative z-10 text-center">
          <i data-lucide="camera" class="w-7 h-7 text-white/40 mx-auto mb-1"></i>
          <span class="text-[10px] text-white/50">${esc(raw.cameraLabel||'')}</span>
        </div>
        <span class="absolute top-2 left-2 z-10 text-[10px] text-white/70 bg-black/40 px-1.5 py-0.5 rounded">截图 1</span>
      </div>
    </div>`;
  } else if (kind === 'manual') {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">现场照片</h4>
      <div class="photo-thumb photo-placeholder aspect-video flex items-center justify-center">
        <div class="relative z-10 text-center">
          <i data-lucide="camera" class="w-7 h-7 text-white/40 mx-auto mb-1"></i>
          <span class="text-[10px] text-white/50">${esc((raw.shots && raw.shots[0]) || '现场抓拍')}</span>
        </div>
        <span class="absolute top-2 left-2 z-10 text-[10px] text-white/70 bg-black/40 px-1.5 py-0.5 rounded">● LIVE</span>
      </div>
    </div>`;
  }

  // 预警信息
  html += `<div class="px-4 mt-4">
    <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-1">预警信息</h4>
    <div class="bg-white rounded-2xl px-4 py-1 shadow-card border border-slate-100">`;
  if (kind === 'alarm') {
    html += infoRow('预警编号', raw.id) + infoRow('企业名称', raw.enterprise) + infoRow('所属镇/街道', raw.town)
      + infoRow('监控点位', raw.cameraLabel || '—') + infoRow('检测类型', raw.detectType) + infoRow('紧急程度', sev)
      + infoRow('AI置信度', Math.round((raw.confidence||0)*100) + '%') + infoRow('报警时间', raw.time) + infoRow('关联工单', raw.orderNo || '—');
  } else if (kind === 'cert') {
    html += infoRow('预警编号', raw.id) + infoRow('企业名称', raw.enterprise) + infoRow('所属镇/街道', raw.town)
      + infoRow('证照类型', raw.certType) + infoRow('证照编号', raw.certNo) + infoRow('到期日期', raw.expiryDate)
      + infoRow('剩余天数', raw.daysLeft + ' 天') + infoRow('紧急程度', sev);
  } else {
    html += infoRow('预警编号', raw.id) + infoRow('企业名称', raw.enterprise) + infoRow('所属镇/街道', raw.town)
      + infoRow('监控点位', raw.cameraLabel || '—') + infoRow('检测类型', raw.detectType) + infoRow('紧急程度', sev)
      + infoRow('报警时间', raw.time) + infoRow('创建人', raw.creator || '—');
  }
  html += `</div></div>`;

  // 问题描述
  if (kind === 'manual' && raw.desc) {
    html += `<div class="px-4 mt-4">
      <h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">问题描述</h4>
      <p class="text-[13px] text-slate-600 leading-relaxed bg-white border border-slate-100 rounded-2xl px-4 py-3 shadow-card whitespace-pre-wrap">${esc(raw.desc)}</p>
    </div>`;
  }

  // 处置
  html += `<div class="px-4 mt-5">`;
  if (raw.status === '待审核') {
    const approveText = kind === 'alarm' ? '采纳并下发' : '确认下发';
    html += `<button onclick="askRisk('approve')" class="w-full py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">${approveText}</button>
      <button onclick="askRisk('revoke')" class="w-full py-3 mt-2 rounded-xl border border-slate-200 text-slate-500 text-sm font-medium active:bg-slate-50">撤销预警</button>
      <p class="text-[11px] text-slate-400 text-center mt-3">下发后状态转为「待整改」，商户端可见</p>`;
  } else if (raw.status === '待整改') {
    html += `<button onclick="askRisk('confirm')" class="w-full py-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">确认整改完成</button>
      <p class="text-[11px] text-slate-400 text-center mt-3">已下发至商户整改，确认后归档为「已确认」</p>`;
  } else if (raw.status === '已确认') {
    html += `<div class="bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3"><p class="text-[12px] text-emerald-700">该预警已整改完成并确认归档。</p></div>`;
  } else {
    html += `<div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-3"><p class="text-[12px] text-slate-500">该预警已撤销，不再下发。</p></div>`;
  }
  html += `</div>`;

  const body = document.getElementById('riskDetailBody');
  body.innerHTML = html;
  body.scrollTop = 0;
  openOverlay('riskDetailOverlay');
}

function askRisk(action) {
  const cfg = {
    approve: { title:'确认下发整改？', desc:'下发后状态转为「待整改」，商户端可见该预警。', confirmText:'确认下发' },
    revoke:  { title:'撤销该预警？', desc:'撤销后商户端将不再看到该预警，且不可恢复。', confirmText:'撤销', danger:true },
    confirm: { title:'确认整改已完成？', desc:'确认后该预警将归档为「已确认」。', confirmText:'确认完成' },
  }[action];
  openActionSheet({ ...cfg, onConfirm: () => actRisk(action) });
}

function actRisk(action) {
  const { kind, id } = currentRisk || {};
  const raw = findRiskRaw(kind, id);
  if (!raw) return;
  if (action === 'approve') { raw.status = '待整改'; showToast('已下发整改，状态更新为待整改', 'success'); }
  else if (action === 'revoke') { raw.status = '已撤销'; showToast('预警已撤销'); }
  else if (action === 'confirm') { raw.status = '已确认'; showToast('已确认整改完成', 'success'); }
  openRiskDetail(kind, id);
  renderRisk();
  updateHeader();
}

let apprTab = 'pending';   // pending | archived
let apprType = 'all';

function approvalRows() {
  return MOCK.approvals.filter(a => inScope(a.town));
}
function archivedRows() {
  return MOCK.archivedApprovals.filter(a => inScope(a.town));
}

function renderApproval() {
  document.getElementById('apprTabs').innerHTML = [
    ['pending','流转中', approvalRows().length],
    ['archived','已归档', archivedRows().length],
  ].map(([v,l,n]) => {
    const on = apprTab === v;
    return `<button onclick="setApprTab('${v}')" class="flex-1 py-2 rounded-xl text-[13px] font-semibold transition-all ${on ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-400'}">${l}<span class="ml-1 text-[11px] font-normal ${on?'text-blue-400':'text-slate-300'}">${n}</span></button>`;
  }).join('');

  const types = [['all','全部类型'],['整改','整改'],['申诉','申诉'],['变更','变更']];
  document.getElementById('apprTypeChips').innerHTML = types.map(([v,l]) => {
    const on = apprType === v;
    return `<button onclick="setApprType('${v}')" class="chip shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium border transition-all ${on ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-500 border-slate-200'}">${l}</button>`;
  }).join('');

  const rows = (apprTab === 'pending' ? approvalRows() : archivedRows())
    .filter(a => apprType === 'all' || a.orderType === apprType);

  const listEl = document.getElementById('apprList');
  if (!rows.length) {
    listEl.innerHTML = `<div class="text-center py-16">
      <i data-lucide="clipboard-check" class="w-9 h-9 text-slate-200 mx-auto mb-2"></i>
      <p class="text-xs text-slate-400">当前条件下暂无记录</p>
    </div>`;
  } else {
    listEl.innerHTML = rows.map(a => {
      const typeCls = a.orderType === '整改' ? 'bg-blue-50 text-blue-600' : a.orderType === '申诉' ? 'bg-purple-50 text-purple-600' : 'bg-teal-50 text-teal-600';
      return `<div onclick="openApprovalDetail('${a.id}', ${apprTab==='archived'})" class="bg-white rounded-2xl p-[16px] shadow-card border border-slate-100 active:bg-slate-50 transition-all">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-md ${typeCls}">${a.orderType}</span>
          <span class="text-[11px] font-mono text-slate-400">${esc(a.orderNo)}</span>
          <span class="ml-auto text-[11px] font-medium px-2 py-0.5 rounded-full ${STATUS_CLS[a.status] || 'bg-slate-100 text-slate-500'}">${a.status}</span>
        </div>
        <h3 class="text-[14px] font-semibold text-slate-800 leading-snug line-clamp-2">${esc(a.sourceDesc)}</h3>
        <p class="text-[12px] text-slate-400 mt-1 truncate">${esc(a.enterprise)} · ${esc(a.town)}</p>
        <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-50">
          <span class="text-[11px] text-slate-400">${esc(a.submitTime)}</span>
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${SEV_CLS[a.severity]}">${a.severity}</span>
        </div>
      </div>`;
    }).join('');
  }
  setTimeout(() => lucide.createIcons(), 40);
}

function setApprTab(v) { apprTab = v; renderApproval(); }
function setApprType(v) { apprType = v; renderApproval(); }

let currentAppr = null;

function openApprovalDetail(id, archived) {
  const pool = archived ? MOCK.archivedApprovals : MOCK.approvals;
  const a = pool.find(x => x.id === id);
  if (!a) return;
  currentAppr = { id, archived };
  document.getElementById('approvalDetailTitle').textContent = (a.orderType || '') + '工单详情';

  let html = `<div class="px-4 pt-4 flex items-center gap-2">
    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${STATUS_CLS[a.status] || 'bg-slate-100 text-slate-500'}">${a.status}</span>
    <span class="text-xs font-medium px-2.5 py-1 rounded-full ${SEV_CLS[a.severity]}">${a.severity}紧急</span>
    <span class="text-[11px] font-mono text-slate-400 ml-auto">${esc(a.orderNo)}</span>
  </div>`;

  html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-1">工单信息</h4>
    <div class="bg-white rounded-2xl px-4 py-1 shadow-card border border-slate-100">
      ${infoRow('工单类型', a.orderType)}
      ${infoRow('来源类型', a.sourceType)}
      ${infoRow('企业名称', a.enterprise)}
      ${infoRow('所属镇/街道', a.town)}
      ${infoRow('提交时间', a.submitTime)}
      ${archived ? infoRow('审核人', a.reviewer || '—') + infoRow('审核时间', a.reviewTime || '—') : ''}
    </div></div>`;

  html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">来源说明</h4>
    <p class="text-[13px] text-slate-600 leading-relaxed bg-white border border-slate-100 rounded-2xl px-4 py-3 shadow-card">${esc(a.sourceDesc)}</p></div>`;

  if (a.changeFields && a.changeFields.length) {
    html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">变更对比</h4>
      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
      ${a.changeFields.map(f => `<div class="px-4 py-3 border-b border-slate-50 last:border-0">
        <div class="text-[12px] font-medium text-slate-700 mb-1">${esc(f.field)}</div>
        <div class="flex items-center gap-2 text-[12px]">
          <span class="text-slate-400 line-through">${esc(f.oldVal)}</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-300"></i>
          <span class="text-blue-600 font-medium">${esc(f.newVal)}</span>
        </div></div>`).join('')}
      </div></div>`;
  }

  if (a.summary) {
    html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">${a.orderType==='申诉'?'申诉说明':'整改说明'}</h4>

  }

  if (a.rectPhotos && a.rectPhotos.length) {
    html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">证明材料</h4>
      <div class="grid grid-cols-3 gap-2">
      ${a.rectPhotos.map(p => `<div class="photo-thumb bg-slate-100 flex flex-col items-center justify-center aspect-square">
        <i data-lucide="image" class="w-5 h-5 text-slate-300 mb-1"></i>
        <span class="text-[9px] text-slate-400 px-1 text-center truncate w-full">${esc(p.name)}</span>
      </div>`).join('')}
      </div></div>`;
  }

  if (a.rejectHistory && a.rejectHistory.length) {
    html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">驳回记录</h4>
      <div class="space-y-2">
      ${a.rejectHistory.map(r => `<div class="bg-orange-50 border border-orange-100 rounded-2xl px-4 py-3">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[11px] font-semibold text-orange-700">驳回 · 第 ${r.rejectRound} 轮</span>
          <span class="text-[10px] text-orange-400">${esc(r.rejectTime)}</span>
        </div>
        <p class="text-[12px] text-orange-800/80 leading-relaxed">${esc(r.reason)}</p>
        <p class="text-[10px] text-orange-400 mt-1">审核人：${esc(r.reviewer)}</p>
      </div>`).join('')}
      </div></div>`;
  }

  if (archived && a.reviewOpinion) {
    html += `<div class="px-4 mt-4"><h4 class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide mb-2">审批意见</h4>
      <div class="bg-emerald-50 border border-emerald-100 rounded-2xl px-4 py-3">
        <p class="text-[12px] text-emerald-800 leading-relaxed">${esc(a.reviewOpinion)}</p>
        <p class="text-[10px] text-emerald-500 mt-1">${esc(a.reviewer)} · ${esc(a.reviewTime)}</p>
      </div></div>`;
  }

  // 操作
  html += `<div class="px-4 mt-5">`;
  if (!archived && a.status === '待审批') {
    html += `<button onclick="askApprove()" class="w-full py-3 rounded-xl bg-emerald-600 text-white text-sm font-semibold active:scale-[0.99] transition-transform">通过审批</button>
      <button onclick="askReject()" class="w-full py-3 mt-2 rounded-xl border border-red-200 text-red-500 text-sm font-medium active:bg-red-50">驳回</button>`;
  } else if (!archived && a.status === '已驳回') {
    html += `<div class="bg-orange-50 border border-orange-100 rounded-xl px-4 py-3"><p class="text-[12px] text-orange-700">该工单已驳回，等待商户补充材料后重新提交。</p></div>`;
  } else {
    html += `<div class="bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3"><p class="text-[12px] text-emerald-700">该工单已审批通过并归档。</p></div>`;
  }
  html += `</div>`;

  const body = document.getElementById('approvalDetailBody');
  body.innerHTML = html;
  body.scrollTop = 0;
  openOverlay('approvalDetailOverlay');
}

function askApprove() {
  openActionSheet({
    title: '确认通过该工单？', desc: '通过后工单将归档，并同步更新对应预警状态。', confirmText: '确认通过',
    onConfirm: () => doApprove(),
  });
}
function doApprove() {
  const { id } = currentAppr || {};
  const idx = MOCK.approvals.findIndex(a => a.id === id);
  if (idx < 0) return;
  const a = MOCK.approvals[idx];
  MOCK.approvals.splice(idx, 1);
  MOCK.archivedApprovals.unshift({
    ...a, status:'已归档', result:'通过', completeTime: nowStamp(),
    reviewer: isDistrict() ? '张主任' : '李所长', reviewTime: nowStamp(),
    reviewOpinion: '经审核，材料齐全、整改到位，予以通过。',
  });
  closeOverlay('approvalDetailOverlay');
  renderApproval();
  updateHeader();
  showToast('工单已通过并归档', 'success');
}
function askReject() {
  openActionSheet({
    title: '驳回原因', desc: '请填写驳回原因，商户将收到该说明。', withInput: true,
    placeholder: '如：提供的证明材料不完整，请补充…', confirmText: '确认驳回', danger: true,
    onConfirm: reason => doReject(reason),
  });
}
function doReject(reason) {
  const { id } = currentAppr || {};
  const a = MOCK.approvals.find(x => x.id === id);
  if (!a) return;
  a.status = '已驳回';
  a.rejectHistory = a.rejectHistory || [];
  a.rejectHistory.push({
    rejectTime: nowStamp(), reviewer: isDistrict() ? '张主任' : '李所长',
    reason, rejectRound: a.rejectHistory.length + 1,
  });
  openApprovalDetail(id, false);
  renderApproval();
  updateHeader();
  showToast('已驳回，商户将收到通知');
}

  body.scrollTop = body.scrollHeight;
}
function sendReply() {
  const input = document.getElementById('threadInput');
  const val = (input.value || '').trim();
  if (!val) { showToast('请输入回复内容'); return; }
  const f = currentThread;
  if (!f) return;
  f.messages = f.messages || [];
  f.messages.push({ id:'M' + Date.now(), sender:'监管员', content: val, time: nowStamp(), isAdmin: true });
  f.status = '已回复';
  input.value = '';
  renderThread();
  showToast('回复已发送', 'success');
}

// ════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('actionSheet').classList.contains('hidden')) { closeActionSheet(); return; }
    const open = document.querySelector('.overlay-panel.open');
    if (open) closeOverlay(open.id);
  }
});

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
switchTab('risk');
lucide.createIcons();
</script>
